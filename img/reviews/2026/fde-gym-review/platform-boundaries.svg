<svg xmlns="http://www.w3.org/2000/svg" width="460" height="490" viewBox="0 0 460 490" role="img" aria-labelledby="title desc"><title id="title">FDE Gym 플랫폼의 저장·실행 경계</title><desc id="desc">브라우저는 사이트 API를 사용합니다. 사이트는 DB와 객체 저장소를 관리하고 runner는 작업을 실행합니다. runner의 모델 호출은 사이트의 relay를 경유하며 공급자 키는 사이트에 남습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#395a72"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#183247} .title{font-size:20px;font-weight:700}.label{font-size:16px}.small{font-size:14px}.head{font-size:17px;font-weight:700}.line{fill:none;stroke:#395a72;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f3f8fc;stroke:#9ab6cb;stroke-width:1.5}.key{fill:#e3f3ec;stroke:#76aa91;stroke-width:1.5}</style><rect width="460" height="490" fill="white"/><text x="20" y="28" class="title">저장과 실행을 나누는 플랫폼</text><path d="M230 85V130" class="line"/><path d="M190 205L115 250" class="line"/><path d="M270 205L345 250" class="line"/><path d="M130 165H10V365H115V385" class="line"/><path d="M330 165H450V365H345V385" class="line"/><rect x="130" y="40" width="200" height="45" rx="10" class="box"/><text x="230.0" y="68.5" text-anchor="middle" class="head">브라우저 작업 화면</text><rect x="130" y="130" width="200" height="75" rx="10" class="key"/><text x="230.0" y="162.5" text-anchor="middle" class="head">사이트 API</text><text x="230.0" y="184.5" text-anchor="middle" class="label">상태 · 토큰 · 중계</text><rect x="20" y="250" width="190" height="60" rx="10" class="box"/><text x="115.0" y="275.0" text-anchor="middle" class="head">PostgreSQL</text><text x="115.0" y="297.0" text-anchor="middle" class="label">실습 · 대화 · 점수</text><rect x="250" y="250" width="190" height="60" rx="10" class="box"/><text x="345.0" y="275.0" text-anchor="middle" class="head">S3 호환 저장소</text><text x="345.0" y="297.0" text-anchor="middle" class="label">사례 아카이브</text><rect x="20" y="385" width="190" height="75" rx="10" class="box"/><text x="115.0" y="406.5" text-anchor="middle" class="head">runner</text><text x="115.0" y="428.5" text-anchor="middle" class="label">작업 공간 · 하네스</text><text x="115.0" y="450.5" text-anchor="middle" class="label">pi · 고객 서버</text><rect x="250" y="385" width="190" height="75" rx="10" class="box"/><text x="345.0" y="406.5" text-anchor="middle" class="head">모델 공급자</text><text x="345.0" y="428.5" text-anchor="middle" class="label">고객 주제 판정</text><text x="345.0" y="450.5" text-anchor="middle" class="label">코딩 모델 응답</text><text x="30" y="342" class="small">RPC · 사례 전달</text><text x="30" y="360" class="small">모델 요청은 사이트 경유</text><text x="255" y="342" class="small">공급자 키는 사이트</text><text x="255" y="360" class="small">relay가 모델 호출</text><text x="20" y="480" class="small">개요 도식 · 실행·네트워크 격리는 배포 설정에 의존합니다.</text></svg>