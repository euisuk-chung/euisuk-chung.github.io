<svg xmlns="http://www.w3.org/2000/svg" width="460" height="490" viewBox="0 0 460 490" role="img" aria-labelledby="title desc"><title id="title">사례 시작부터 채점 결과 저장까지</title><desc id="desc">고정 사례 버전에서 new가 작업 공간을 만들고 serve로 고객과 상호작용합니다. Submit은 작업 단계를 닫고 grade는 복사본을 사례별 채점기로 재생합니다. KPI 개선과 개입 비용을 계산한 결과가 DB에 저장됩니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#395a72"/></marker></defs><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#183247} .title{font-size:20px;font-weight:700}.label{font-size:16px}.small{font-size:14px}.head{font-size:17px;font-weight:700}.line{fill:none;stroke:#395a72;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f3f8fc;stroke:#9ab6cb;stroke-width:1.5}.key{fill:#e3f3ec;stroke:#76aa91;stroke-width:1.5}</style><rect width="460" height="490" fill="white"/><text x="20" y="28" class="title">한 번의 실습이 점수가 되기까지</text><path d="M230 95V120" class="line"/><path d="M230 195V220" class="line"/><path d="M230 295V315H120V340" class="line"/><path d="M200 375H250" class="line"/><path d="M335 410V435" class="line"/><rect x="40" y="45" width="380" height="50" rx="10" class="box"/><text x="230.0" y="76.0" text-anchor="middle" class="head">사례 ID + bundle SHA + 숨겨진 변형</text><rect x="40" y="120" width="380" height="75" rx="10" class="box"/><text x="230.0" y="141.5" text-anchor="middle" class="head">new → 작업 공간</text><text x="230.0" y="163.5" text-anchor="middle" class="label">TASK.md · docs/data는 읽기 자료</text><text x="230.0" y="185.5" text-anchor="middle" class="label">system/ · deliverables/를 수정</text><rect x="40" y="220" width="380" height="75" rx="10" class="box"/><text x="230.0" y="241.5" text-anchor="middle" class="head">serve → 작업과 상호작용</text><text x="230.0" y="263.5" text-anchor="middle" class="label">사람: 질문 · 기다림 · 시험 운영</text><text x="230.0" y="285.5" text-anchor="middle" class="label">pi: 파일 읽기 · 명령 실행 · 코드 편집</text><rect x="40" y="340" width="160" height="70" rx="10" class="key"/><text x="120.0" y="359.0" text-anchor="middle" class="head">Submit</text><text x="120.0" y="381.0" text-anchor="middle" class="label">실행 중 작업 검사</text><text x="120.0" y="403.0" text-anchor="middle" class="label">grading 상태</text><rect x="250" y="340" width="170" height="70" rx="10" class="box"/><text x="335.0" y="359.0" text-anchor="middle" class="head">grade</text><text x="335.0" y="381.0" text-anchor="middle" class="label">작업 사본 재생</text><text x="335.0" y="403.0" text-anchor="middle" class="label">사례별 grader</text><rect x="250" y="435" width="170" height="40" rx="10" class="box"/><text x="335.0" y="461.0" text-anchor="middle" class="head">결과 → DB</text><text x="20" y="435" class="small">고객 KPI 개선량</text><text x="20" y="456" class="small">− 고객 측 개입 비용</text><text x="20" y="480" class="small">사건 처리 후 순점수 · API 비용은 별도 지표입니다.</text></svg>