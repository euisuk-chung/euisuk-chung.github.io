<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">Weight-Space Programming의 세 작업</title><desc id="desc">읽기는 가설을 별도 측정과 대조하고, 수정과 작성은 완성된 모델을 실행해 검증합니다. 도구와 피드백은 실험마다 다릅니다.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="640" height="430" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="320" y="35" font-size="24" font-weight="bold">가중치에 대해 묻기 · 바꾸기 · 만들기</text><rect x="12" y="60" width="196" height="198" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="110" y="94" font-size="24" font-weight="bold">읽기</text><text x="110" y="127" font-size="17">기존 가중치</text><text x="110" y="153" font-size="17">구조·입출력 설명</text><path d="M110 168V190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/><text x="110" y="222" font-size="15">정체·내부 역할에 대한 가설</text><path d="M110 258V291" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/><rect x="222" y="60" width="196" height="198" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="320" y="94" font-size="24" font-weight="bold">수정</text><text x="320" y="127" font-size="17">실패 사례</text><text x="320" y="153" font-size="17">기존 가중치</text><path d="M320 168V190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/><text x="320" y="222" font-size="15">변경된 가중치</text><path d="M320 258V291" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/><rect x="432" y="60" width="196" height="198" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="530" y="94" font-size="24" font-weight="bold">작성</text><text x="530" y="127" font-size="17">원하는 규칙</text><text x="530" y="153" font-size="17">영 가중치</text><path d="M530 168V190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/><text x="530" y="222" font-size="15">새 정책의 가중치</text><path d="M530 258V291" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/><rect x="12" y="295" width="196" height="74" rx="10" fill="#fff" stroke="#94a3b8"/><text x="110" y="326" font-size="19">숨긴 정체·역할과</text><text x="110" y="352" font-size="19">별도 관측으로 대조</text><rect x="222" y="295" width="406" height="74" rx="10" fill="#fff" stroke="#94a3b8"/><text x="425" y="326" font-size="19">완성된 신경망을 실행해</text><text x="425" y="352" font-size="19">행동·성능을 평가</text><text x="320" y="408" font-size="18">도구·연습 문제·실행 피드백 허용 범위는 실험별로 다릅니다.</text></g></svg>