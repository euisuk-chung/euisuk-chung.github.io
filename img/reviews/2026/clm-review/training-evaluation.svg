<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">CLM 미세조정과 궤적 평가</title><desc id="desc">학습에서 보류 task를 제외하고 검증으로 선택한 체크포인트를 별도 평가 임베딩에 적용합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker></defs><rect width="640" height="460" rx="16" fill="#f4f7fc"/><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#182a42;font-size:19px} .title{font-size:24px;font-weight:700} .small{font-size:17px} .box{fill:white;stroke:#7c95b5;stroke-width:1.5} .blue{fill:#e0edff;stroke:#487bc1;stroke-width:1.5} .green{fill:#e0f1ea;stroke:#55957c;stroke-width:1.5} .arrow{fill:none;stroke:#52647c;stroke-width:2;marker-end:url(#arrow)}</style><text class="title" x="26" y="37">헤드 학습과 궤적 선택 평가</text><rect class="blue" x="30" y="60" width="280" height="74" rx="10"/><text text-anchor="middle" x="170.0" y="87">학습용 상태·행동 임베딩</text><text text-anchor="middle" x="170.0" y="113">holdout task 제외</text><rect class="green" x="330" y="60" width="280" height="74" rx="10"/><text text-anchor="middle" x="470.0" y="87">별도 평가용 임베딩</text><text text-anchor="middle" x="470.0" y="113">보류한 후보 궤적</text><path class="arrow" d="M 170 134 V 150"/><path class="arrow" d="M 470 134 V 250"/><rect class="blue" x="30" y="152" width="280" height="74" rx="10"/><text text-anchor="middle" x="170.0" y="179">task별 train / val 분할</text><text text-anchor="middle" x="170.0" y="205">두 헤드 + 배율 학습</text><path class="arrow" d="M 170 226 V 244"/><rect class="blue" x="30" y="246" width="280" height="74" rx="10"/><text text-anchor="middle" x="170.0" y="273">검증 지표로 선택</text><text text-anchor="middle" x="170.0" y="299">best_head.pt</text><path class="arrow" d="M 310 283 H 328"/><rect class="green" x="330" y="252" width="280" height="74" rx="10"/><text text-anchor="middle" x="470.0" y="279">단계별 코사인 점수</text><text text-anchor="middle" x="470.0" y="305">마지막 K단계 평균</text><path class="arrow" d="M 470 326 V 344"/><rect class="green" x="330" y="346" width="280" height="74" rx="10"/><text text-anchor="middle" x="470.0" y="373">best-of-N 선택</text><text text-anchor="middle" x="470.0" y="399">입력 reward로 평가</text><text class="small" x="32" y="361">언어 모델 본체는</text><text class="small" x="32" y="386">헤드 최적화에 포함되지 않음</text><text class="small" x="320" y="446" text-anchor="middle">평가 스크립트는 후보 생성·정답 테스트를 실행하지 않음</text></svg>