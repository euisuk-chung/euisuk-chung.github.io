<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">CLM 추론 흐름</title><desc id="desc">상태와 후보는 다른 투영 헤드를 거쳐 내적으로 비교됩니다. 캐시 누락 시 외부 임베딩 서버를 호출합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker></defs><rect width="640" height="460" rx="16" fill="#f4f7fc"/><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#182a42;font-size:19px} .title{font-size:24px;font-weight:700} .small{font-size:17px} .box{fill:white;stroke:#7c95b5;stroke-width:1.5} .blue{fill:#e0edff;stroke:#487bc1;stroke-width:1.5} .green{fill:#e0f1ea;stroke:#55957c;stroke-width:1.5} .arrow{fill:none;stroke:#52647c;stroke-width:2;marker-end:url(#arrow)}</style><text class="title" x="26" y="37">CLM 추론: 텍스트에서 후보 분포까지</text><rect class="box" x="30" y="57" width="580" height="49" rx="10"/><text text-anchor="middle" x="320.0" y="84">state + questions → build_pairs</text><path class="arrow" d="M 170 106 V 123"/><path class="arrow" d="M 470 106 V 123"/><rect class="blue" x="30" y="125" width="280" height="50" rx="10"/><text text-anchor="middle" x="170.0" y="152">상태 산문 + 질문</text><rect class="green" x="330" y="125" width="280" height="50" rx="10"/><text text-anchor="middle" x="470.0" y="152">후보 설명 목록</text><path class="arrow" d="M 170 175 V 193"/><path class="arrow" d="M 470 175 V 193"/><rect class="box" x="30" y="195" width="580" height="76" rx="10"/><text text-anchor="middle" x="320.0" y="222">벡터 캐시 조회 → 누락 텍스트만 계산</text><text text-anchor="middle" x="320.0" y="248">원본 캐시 → 외부 Qwen3 임베딩</text><path class="arrow" d="M 170 271 V 288"/><path class="arrow" d="M 470 271 V 288"/><rect class="blue" x="30" y="290" width="280" height="50" rx="10"/><text text-anchor="middle" x="170.0" y="317">state head → 정규화</text><rect class="green" x="330" y="290" width="280" height="50" rx="10"/><text text-anchor="middle" x="470.0" y="317">action head → 정규화</text><path class="arrow" d="M 170 340 V 354 H 320 V 368"/><path class="arrow" d="M 470 340 V 354 H 320"/><rect class="box" x="85" y="370" width="470" height="49" rx="10"/><text text-anchor="middle" x="320.0" y="397">내적 × 배율 ÷ 온도 → softmax</text><text class="small" x="320" y="445" text-anchor="middle">Choice / Noul / Score · 적중 벡터는 계산 생략</text></svg>