<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510"><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#576e8e"/></marker></defs><rect width="640" height="510" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b48"><text x="320" y="35" text-anchor="middle" font-size="27" font-weight="700">변경 코드에서 PR 댓글까지</text><rect x="35" y="55" width="570" height="78" rx="12" fill="#edf3ff" stroke="#a5b4cc"/><text x="320" y="86" text-anchor="middle" font-size="25" font-weight="700">1. PR 메타데이터 + diff</text><text x="320" y="114" text-anchor="middle" font-size="21" fill="#405168">GitHub API → 제외 경로·생성 파일 처리</text><path d="M320 135v23" stroke="#576e8e" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="165" width="570" height="78" rx="12" fill="#edf3ff" stroke="#a5b4cc"/><text x="320" y="196" text-anchor="middle" font-size="25" font-weight="700">2. Claude Code CLI</text><text x="320" y="224" text-anchor="middle" font-size="21" fill="#405168">저장소 탐색 + 보안 후보 JSON</text><path d="M320 245v23" stroke="#576e8e" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="275" width="570" height="78" rx="12" fill="#edf3ff" stroke="#a5b4cc"/><text x="320" y="306" text-anchor="middle" font-size="25" font-weight="700">3. 두 단계 후보 필터</text><text x="320" y="334" text-anchor="middle" font-size="21" fill="#405168">고정 제외 규칙 → 개별 Claude API</text><path d="M320 355v23" stroke="#576e8e" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="385" width="570" height="78" rx="12" fill="#edf3ff" stroke="#a5b4cc"/><text x="320" y="416" text-anchor="middle" font-size="25" font-weight="700">4. 결과 저장 + 리뷰 댓글</text><text x="320" y="444" text-anchor="middle" font-size="21" fill="#405168">findings.json → 변경 파일의 오른쪽 줄</text><text x="320" y="491" text-anchor="middle" font-size="20" fill="#53627b">코드 정적 분석에 따른 리뷰어 도식</text></g></svg>