<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">순위 평가와 확률 평가</title><desc id="desc">같은 문서별 확률로 정렬, 임계값 선택, 관련 수 추정을 하지만 서로 다른 지표가 필요합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52617a"/></marker></defs><rect width="800" height="420" rx="20" fill="#f4f7fc"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#182a47"><text x="400" y="42" font-size="26" font-weight="bold">같은 확률, 다른 쓰임</text><rect x="220" y="68" width="360" height="75" rx="13" fill="#e1eaff" stroke="#4266b2"/><text x="400" y="101" font-size="23">질문마다 문서별 확률 p</text><text x="400" y="127" font-size="18">동일한 BM25 후보 100개</text><g fill="none" stroke="#52617a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M320 143 L145 205"/><path d="M400 143 L400 205"/><path d="M480 143 L655 205"/></g><rect x="35" y="214" width="220" height="133" rx="13" fill="white" stroke="#bdc9dc"/><rect x="290" y="214" width="220" height="133" rx="13" fill="white" stroke="#bdc9dc"/><rect x="545" y="214" width="220" height="133" rx="13" fill="white" stroke="#bdc9dc"/><text x="145" y="250" font-size="24" font-weight="bold">확률순 정렬</text><text x="145" y="286" font-size="21">앞의 문서가 좋은가?</text><text x="145" y="321" font-size="21" fill="#335fb3">nDCG@10</text><text x="400" y="250" font-size="24" font-weight="bold">p ≥ 0.5 선택</text><text x="400" y="286" font-size="21">남긴 집합이 좋은가?</text><text x="400" y="321" font-size="21" fill="#335fb3">F1@.5</text><text x="655" y="250" font-size="24" font-weight="bold">판정된 확률의 합</text><text x="655" y="286" font-size="21">관련 개수가 맞는가?</text><text x="655" y="321" font-size="21" fill="#335fb3">개수 평균 절대 오차</text><text x="400" y="387" font-size="22">확률의 의미가 맞는지는 ECE·Brier로 따로 확인합니다.</text></g></svg>