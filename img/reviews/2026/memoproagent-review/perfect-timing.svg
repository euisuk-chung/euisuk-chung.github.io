<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Perfect는 내용·시점·횟수를 함께 봅니다</title>
<desc id="desc">트리거 윈도와 끝의 허용치 안에서 한 번만 올바르게 알리면 Perfect입니다. 같은 알림을 반복하거나 너무 일찍 말하면 실패합니다.</desc>
<rect width="720" height="380" rx="18" fill="#f6f8fc"/>
<g font-family="sans-serif" fill="#17283c">
<text x="28" y="39" font-size="24" font-weight="700">맞는 말을, 맞는 때에, 한 번만</text>
<text x="28" y="69" font-size="17">모든 점은 내용이 올바른 알림을 뜻합니다.</text>
<rect x="350" y="90" width="190" height="234" rx="10" fill="#d8efe5"/>
<rect x="540" y="90" width="45" height="234" fill="#e8f5ef"/>
<text x="367" y="115" font-size="18" font-weight="700">트리거 윈도</text>
<text x="541" y="350" font-size="16">+2초</text>
<g stroke="#a9b7c7" stroke-width="2"><path d="M220 158H664"/><path d="M220 226H664"/><path d="M220 294H664"/></g>
<text x="28" y="164" font-size="21">한 번 알림: 성공</text>
<text x="28" y="232" font-size="21">반복 알림: 실패</text>
<text x="28" y="300" font-size="21">이른 알림: 실패</text>
<g fill="#228765" stroke="white" stroke-width="3"><circle cx="440" cy="158" r="10"/><circle cx="400" cy="226" r="10"/><circle cx="500" cy="226" r="10"/></g>
<circle cx="282" cy="294" r="10" fill="#bd554c" stroke="white" stroke-width="3"/>
<text x="220" y="350" font-size="16">시간 →</text>
</g></svg>
