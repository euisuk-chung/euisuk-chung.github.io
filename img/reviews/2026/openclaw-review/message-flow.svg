<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img" aria-labelledby="title desc">
<title id="title">OpenClaw 메시지 처리 흐름</title><desc id="desc">Control UI에서 Gateway로 들어온 요청은 세션 검증과 접수 응답 후 공통 응답 파이프라인, 실행 큐, 도구와 모델 실행, 결과 전달로 이어집니다. CLI 런타임은 조건부 분기입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#4263a5"/></marker></defs>
<rect width="720" height="1090" fill="#f5f7fb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle"><text x="360" y="46" font-size="27" font-weight="700" fill="#17324d">OpenClaw: 메시지에서 응답까지</text><text x="360" y="79" font-size="18" fill="#526277">리뷰어 도식 · 일반 embedded 경로 중심</text>
<rect x="40" y="110" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="145" font-size="25" font-weight="700" fill="#17324d">1. Control UI → Gateway</text>
<text x="360" y="177" font-size="21" fill="#405771">chat.send · 메시지 / 첨부 / 요청 ID</text>
<path d="M360 206 V229" stroke="#4263a5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="240" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="275" font-size="25" font-weight="700" fill="#17324d">2. 요청 검증 · 세션 확인</text>
<text x="360" y="307" font-size="21" fill="#405771">sessionKey: 대화 / runId: 이번 실행</text>
<path d="M360 336 V359" stroke="#4263a5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="405" font-size="25" font-weight="700" fill="#17324d">3. started ACK → 비동기 dispatch</text>
<text x="360" y="437" font-size="21" fill="#405771">접수 응답과 작업 완료는 별개</text>
<path d="M360 466 V489" stroke="#4263a5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="500" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="535" font-size="25" font-weight="700" fill="#17324d">4. 공통 응답 파이프라인</text>
<text x="360" y="567" font-size="21" fill="#405771">문맥 정리 · 정책 · reply resolver</text>
<path d="M360 596 V619" stroke="#4263a5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="630" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="665" font-size="25" font-weight="700" fill="#17324d">5. 실행 준비 · 세션 큐 → 전역 큐</text>
<text x="360" y="697" font-size="21" fill="#405771">조건 충족 시 CLI 런타임으로 분기</text>
<path d="M360 726 V749" stroke="#4263a5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="760" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="795" font-size="25" font-weight="700" fill="#17324d">6. embedded 실행 시도</text>
<text x="360" y="827" font-size="21" fill="#405771">도구 · 프롬프트 준비 → session.prompt</text>
<path d="M360 856 V879" stroke="#4263a5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="890" width="640" height="94" rx="14" fill="white" stroke="#a6bad5" stroke-width="2"/>
<text x="360" y="925" font-size="25" font-weight="700" fill="#17324d">7. 응답 수집 · 기록 · 이벤트</text>
<text x="360" y="957" font-size="21" fill="#405771">block / final / 도구 미디어 구분</text>
<text x="360" y="1030" font-size="19" fill="#526277">모델 제공자 · 채팅 플랫폼은 설정에 따라 외부 연결</text>
<text x="360" y="1061" font-size="17" fill="#526277">분석 커밋 47918f787d84 · 세부 정책 및 오류 분기 생략</text></g></svg>