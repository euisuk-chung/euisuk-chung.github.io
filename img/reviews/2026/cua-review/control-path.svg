<svg xmlns="http://www.w3.org/2000/svg" width="500" height="480" viewBox="0 0 500 480" role="img" aria-labelledby="t d"><title id="t">Cua computer 도구의 제어 경로</title><desc id="d">에이전트 MCP 요청에서 대상 선택과 환경 접속을 거쳐 ComputerService와 Driver backend로 연결되는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs><rect width="500" height="480" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172554"><text x="250" y="36" font-size="24" font-weight="700">Cua: 관찰과 입력이 오가는 경로</text><rect x="30" y="56" width="440" height="65" rx="12" fill="#dbeafe"/><text x="250" y="83" font-size="23" font-weight="700">에이전트 → cua mcp</text><text x="250" y="108" font-size="19">tool 이름 · sandbox · 입력 인자</text><path d="M250 123V145" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="150" width="440" height="66" rx="12" fill="#e0e7ff"/><text x="250" y="177" font-size="23" font-weight="700">대상 선택 · env_of</text><text x="250" y="202" font-size="19">Space / direct / sandbox 연결</text><path d="M250 218V240" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="245" width="440" height="66" rx="12" fill="#ccfbf1"/><text x="250" y="272" font-size="23" font-weight="700">cua-spacesd · ComputerService</text><text x="250" y="297" font-size="19">캡처 응답 / 포인터 요청</text><path d="M250 313V335" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="340" width="440" height="66" rx="12" fill="#fef3c7"/><text x="250" y="367" font-size="23" font-weight="700">desktop backend</text><text x="250" y="392" font-size="19">화면 캡처 제공자 · Driver 입력 도구</text><text x="250" y="442" font-size="19">결과는 역방향으로 반환됩니다</text><text x="250" y="467" font-size="17" fill="#475569">리뷰어 작성 · 고정 커밋의 선택한 경로</text></g></svg>
