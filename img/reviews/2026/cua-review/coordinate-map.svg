<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360" role="img" aria-labelledby="t d"><title id="t">화면 좌표 변환의 설명용 예</title><desc id="d">이미지 좌표 300,150을 배율 1.5로 나누고 시작점 100,50을 더하면 화면 논리 좌표 300,150이 된다</desc><rect width="500" height="360" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172554"><text x="250" y="37" font-size="24" font-weight="700">이미지 픽셀 ≠ 화면의 논리 좌표</text><rect x="30" y="60" width="440" height="74" rx="12" fill="#dbeafe"/><text x="250" y="89" font-size="22">이미지에서 고른 위치</text><text x="250" y="120" font-size="25" font-weight="700">(300, 150)</text><text x="250" y="169" font-size="22">÷ 배율 1.5 → (200, 100)</text><text x="250" y="207" font-size="22">+ 시작점 (100, 50)</text><rect x="30" y="231" width="440" height="70" rx="12" fill="#ccfbf1"/><text x="250" y="260" font-size="22">화면의 논리 좌표</text><text x="250" y="288" font-size="25" font-weight="700">(300, 150)</text><text x="250" y="337" font-size="18" fill="#475569">설명용 수치 · 실제 앱의 실행 결과 아님</text></g></svg>
