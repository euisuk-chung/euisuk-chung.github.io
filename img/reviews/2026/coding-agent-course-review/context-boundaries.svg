<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-label="Explore: 질문은 분리하고 보고서는 합칩니다"><title>Explore: 질문은 분리하고 보고서는 합칩니다</title><desc>부모의 전체 대화 이력을 넘기지 않고 독립 prompt와 새 deps로 같은 프로세스의 Agent를 호출합니다. 기본 Explore는 read, glob, grep, lsp를 사용합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="640" height="460" rx="18" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#172554"><text x="28" y="38" font-size="25" font-weight="700">Explore: 질문은 분리하고 보고서는 합칩니다</text><rect x="28" y="60" width="584" height="79" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="320.0" y="89" text-anchor="middle" font-size="21" font-weight="700">부모 Agent</text><text x="320.0" y="115" text-anchor="middle" font-size="18">부모 대화 이력 유지 · 자식별 질문/범위/근거 지정</text><path d="M170 139 L170 183" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 139 L470 183" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="185" width="284" height="107" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="170.0" y="214" text-anchor="middle" font-size="21" font-weight="700">Explore 자식 A</text><text x="170.0" y="240" text-anchor="middle" font-size="18">독립 prompt · 새 deps</text><text x="170.0" y="264" text-anchor="middle" font-size="18">read / glob / grep / lsp</text><rect x="328" y="185" width="284" height="107" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="470.0" y="214" text-anchor="middle" font-size="21" font-weight="700">Explore 자식 B</text><text x="470.0" y="240" text-anchor="middle" font-size="18">독립 prompt · 새 deps</text><text x="470.0" y="264" text-anchor="middle" font-size="18">기본 persona의 도구 제한</text><path d="M170 292 L170 331" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 292 L470 331" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="333" width="584" height="75" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="320.0" y="362" text-anchor="middle" font-size="21" font-weight="700">보고서 예산을 나눠 부모에게 반환</text><text x="320.0" y="388" text-anchor="middle" font-size="18">라벨별 결과 결합 · 최종 종합은 부모 모델</text><text x="320" y="439" font-size="18" text-anchor="middle">기본 상한: fan-out 6 · 동시 4 · 자식당 요청 25</text></g></svg>