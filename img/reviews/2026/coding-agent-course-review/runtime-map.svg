<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-label="같은 Agent 구성, 다른 실행 제어"><title>같은 Agent 구성, 다른 실행 제어</title><desc>build_agent의 모델·도구·instructions를 대화형과 headless가 공유하지만, 대화형은 Runner와 Handler, headless는 agent.run을 사용합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="640" height="460" rx="18" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#172554"><text x="28" y="38" font-size="25" font-weight="700">같은 Agent 구성, 다른 실행 제어</text><rect x="28" y="60" width="584" height="75" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="320.0" y="89" text-anchor="middle" font-size="21" font-weight="700">build_agent()</text><text x="320.0" y="115" text-anchor="middle" font-size="18">모델 provider + 도구 목록 + instructions</text><path d="M170 135 L170 169" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 135 L470 169" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="171" width="284" height="110" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="170.0" y="200" text-anchor="middle" font-size="21" font-weight="700">대화형 TUI</text><text x="170.0" y="226" text-anchor="middle" font-size="18">Runner + TurnHandler</text><text x="170.0" y="250" text-anchor="middle" font-size="18">큐 · 승인 재개 · 이력 압축</text><rect x="328" y="171" width="284" height="110" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="470.0" y="200" text-anchor="middle" font-size="21" font-weight="700">headless / remote</text><text x="470.0" y="226" text-anchor="middle" font-size="18">agent.run() + BYPASS</text><text x="470.0" y="250" text-anchor="middle" font-size="18">요청 상한 · 종료 summary</text><path d="M170 281 L170 317" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 281 L470 317" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="319" width="584" height="75" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="320.0" y="348" text-anchor="middle" font-size="21" font-weight="700">파일·셸 도구 → 실행기</text><text x="320.0" y="374" text-anchor="middle" font-size="18">local none / Docker / Modal</text><text x="320" y="427" font-size="19" text-anchor="middle">공유한 구성 ≠ 동일한 턴 제어·승인·압축 경로</text></g></svg>