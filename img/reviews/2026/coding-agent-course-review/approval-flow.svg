<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-label="대화형 도구 승인과 재개"><title>대화형 도구 승인과 재개</title><desc>하나의 leg 안에서 모델과 도구 노드를 순회하고 승인 중단이면 게이트와 사용자 판단을 거쳐 다음 leg에서 재개합니다. 내부 모든 모델 요청마다 Runner 경계가 생기는 것은 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="640" height="460" rx="18" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#172554"><text x="28" y="38" font-size="25" font-weight="700">대화형 도구 승인과 재개</text><rect x="28" y="58" width="584" height="67" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="320.0" y="87" text-anchor="middle" font-size="21" font-weight="700">MODEL_REQUEST 경계 → leg 시작</text><text x="320.0" y="113" text-anchor="middle" font-size="18">steering · 기존 이력 · 승인 결과 전달</text><path d="M208 125 L208 157" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="159" width="360" height="75" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="208.0" y="188" text-anchor="middle" font-size="21" font-weight="700">agent.iter() 노드 순회</text><text x="208.0" y="214" text-anchor="middle" font-size="18">모델 응답 · 도구 호출 스트리밍</text><rect x="422" y="159" width="190" height="75" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="517.0" y="188" text-anchor="middle" font-size="21" font-weight="700">최종 텍스트</text><text x="517.0" y="214" text-anchor="middle" font-size="18">승인 중단 없음</text><path d="M388 195 L422 195" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M208 234 L208 263" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="265" width="360" height="72" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="208.0" y="294" text-anchor="middle" font-size="21" font-weight="700">승인 중단 → Gate</text><text x="208.0" y="320" text-anchor="middle" font-size="18">deny → allow → 모드 → 사용자</text><path d="M208 337 L208 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="367" width="360" height="65" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="208.0" y="396" text-anchor="middle" font-size="21" font-weight="700">True / ToolDenied</text><text x="208.0" y="422" text-anchor="middle" font-size="18">다음 leg에서 재개</text><path d="M28 400 L12 400 L12 92 L28 92" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M517 234 L517 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="422" y="367" width="190" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="517.0" y="396" text-anchor="middle" font-size="21" font-weight="700">저장·압축</text><text x="517.0" y="422" text-anchor="middle" font-size="18">WOULD_STOP</text></g></svg>