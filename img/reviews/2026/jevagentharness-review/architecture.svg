<svg xmlns="http://www.w3.org/2000/svg" width="500" height="490" viewBox="0 0 500 490" role="img" aria-label="모델 호출은 프록시로, 도구 실행은 클라이언트로"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#425466"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#15283d"><text x="250" y="28" text-anchor="middle" font-size="19" font-weight="700">모델 호출은 프록시로, 도구 실행은 클라이언트로</text><rect x="35" y="48" width="430" height="55" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="250.0" y="64.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">기존 코딩 에이전트</text><text x="250.0" y="86.5" text-anchor="middle" dominant-baseline="middle" font-size="17">모델 요청 · 도구 결과를 포함한 이력</text><path d="M250 103 V120" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="123" width="430" height="55" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="250.0" y="139.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">JevAgentHarness 로컬 프록시</text><text x="250.0" y="161.5" text-anchor="middle" dominant-baseline="middle" font-size="17">Chat / Responses → Request → 상태 요약</text><path d="M150 178 V204" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="205" width="210" height="58" rx="9" fill="#fff3c4" stroke="#91a4b7"/><text x="140.0" y="223.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">결정 모델</text><text x="140.0" y="245.0" text-anchor="middle" dominant-baseline="middle" font-size="16">routine / hard 확률</text><rect x="275" y="205" width="190" height="58" rx="9" fill="#dff5e4" stroke="#91a4b7"/><text x="370.0" y="223.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">라우팅·재검사</text><text x="370.0" y="245.0" text-anchor="middle" dominant-baseline="middle" font-size="16">tier 선택 / 종료 확인</text><path d="M245 234 H274" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M370 263 V278" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="275" y="280" width="190" height="58" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="370.0" y="298.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">strong / fast LLM</text><text x="370.0" y="320.0" text-anchor="middle" dominant-baseline="middle" font-size="16">응답과 도구 호출 작성</text><path d="M370 338 V359 H250 V377" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="378" width="430" height="58" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="250.0" y="396.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">클라이언트가 응답을 받아 도구 실행</text><text x="250.0" y="418.0" text-anchor="middle" dominant-baseline="middle" font-size="17">실행 결과를 다음 모델 요청에 포함</text><path d="M35 405 H17 V75 H34" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><text x="250" y="467" text-anchor="middle" font-size="14">결정 모델과 LLM은 설정된 외부·로컬 endpoint를 사용합니다.</text></g></svg>