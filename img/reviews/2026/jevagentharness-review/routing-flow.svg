<svg xmlns="http://www.w3.org/2000/svg" width="500" height="490" viewBox="0 0 500 490" role="img" aria-label="기본 정책: 선택 후 fast 응답을 재검사"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#425466"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#15283d"><text x="250" y="28" text-anchor="middle" font-size="19" font-weight="700">기본 정책: 선택 후 fast 응답을 재검사</text><rect x="35" y="49" width="430" height="66" rx="9" fill="#fff3c4" stroke="#91a4b7"/><text x="250.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">첫 단계는 strong으로 고정</text><text x="250.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-size="17">후속 단계: p(hard) ≥ τ 를 비교</text><path d="M150 115 V145" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M350 115 V145" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><text x="110" y="136" text-anchor="middle" font-size="14">참</text><text x="390" y="136" text-anchor="middle" font-size="14">거짓</text><rect x="35" y="147" width="200" height="58" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="135.0" y="165.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">strong LLM</text><text x="135.0" y="187.0" text-anchor="middle" dominant-baseline="middle" font-size="17">어려운 단계의 응답 작성</text><rect x="265" y="147" width="200" height="58" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="365.0" y="165.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">fast LLM</text><text x="365.0" y="187.0" text-anchor="middle" dominant-baseline="middle" font-size="17">일상 단계의 응답 작성</text><path d="M365 205 V236" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="265" y="238" width="200" height="75" rx="9" fill="#ffe6df" stroke="#91a4b7"/><text x="365.0" y="264.5" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">fast 오류 또는</text><text x="365.0" y="286.5" text-anchor="middle" dominant-baseline="middle" font-size="16">도구 사용 중 종료 응답?</text><path d="M265 275 H250 V176 H236" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><text x="215" y="231" text-anchor="middle" font-size="14">예: 재작성</text><path d="M135 205 V384 H249" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M365 313 V384 H251" fill="none" stroke="#425466" stroke-width="2.2" marker-end="url(#arrow)"/><text x="375" y="347" text-anchor="middle" font-size="14">아니오</text><rect x="35" y="386" width="430" height="58" rx="9" fill="#e0efff" stroke="#91a4b7"/><text x="250.0" y="404.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700">공통 응답 → 클라이언트</text><text x="250.0" y="426.0" text-anchor="middle" dominant-baseline="middle" font-size="17">도구 실행은 원래 에이전트의 역할</text><text x="250" y="474" text-anchor="middle" font-size="14">종료 재작성은 실제 과제 채점·성공 보장이 아닙니다.</text></g></svg>