<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc">
<title id="title">코드 수정의 선택 루프</title>
<desc id="desc">평가 중 coder · world model은 고정됩니다</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#475569"/></marker></defs>
<rect width="420" height="490" rx="16" fill="#f8fafc"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle">
<text x="210" y="32" font-size="21" font-weight="700" fill="#0f172a">코드 수정의 선택 루프</text>
<text x="210" y="56" font-size="15" fill="#475569">평가 중 coder · world model은 고정됩니다</text>
<rect x="28" y="76" width="364" height="58" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="210" y="100" font-size="18" font-weight="650" fill="#0f172a">문제 + 현재 코드 + 공개 피드백</text>
<text x="210" y="121" font-size="15.5" fill="#334155">공개 테스트 통과 시 조기 종료</text>
<path d="M210 135 V147" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="151" width="364" height="58" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="210" y="175" font-size="18" font-weight="650" fill="#0f172a">네 수정안 + 현재 코드 유지</text>
<text x="210" y="196" font-size="15.5" fill="#334155">첫 후보는 기록 · 이후 fresh / recorded</text>
<path d="M210 210 V222" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="226" width="364" height="58" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="210" y="250" font-size="18" font-weight="650" fill="#0f172a">world model이 다섯 후보 예측</text>
<text x="210" y="271" font-size="15.5" fill="#334155">통과 확률 + 0.25 × 예측 통과 비율</text>
<path d="M210 285 V297" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="301" width="364" height="58" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="210" y="325" font-size="18" font-weight="650" fill="#0f172a">현재 코드보다 높은 후보만 교체</text>
<text x="210" y="346" font-size="15.5" fill="#334155">선택 결과의 공개 실행 → 다음 피드백</text>
<path d="M210 360 V372" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="376" width="364" height="58" rx="10" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="210" y="400" font-size="18" font-weight="650" fill="#0f172a">최대 3회 → 모든 선택 봉인</text>
<text x="210" y="421" font-size="15.5" fill="#334155">그 뒤 hidden judge → 최종 성공률</text>
<text x="210" y="472" font-size="14.5" fill="#475569">학습 4단계 파이프라인과 평가 루프는 별개입니다</text></g></svg>
