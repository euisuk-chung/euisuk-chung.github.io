<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">요청과 작업 상태의 흐름</title><desc id="desc">입력은 관계 판단으로 분류되고 요청 브랜치에서 작업한 상태가 main에 병합됩니다. 답변은 answers 브랜치에 별도로 기록됩니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="640" height="480" fill="#f8fafc"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#0f172a}.h{font-size:25px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:18px}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}</style>
<text class="h" x="32" y="40">메시지를 상태 변경으로 바꾸기</text>
<rect class="box" x="30" y="66" width="250" height="76" rx="12"/><text class="l" x="48" y="97">입력 · submit()</text><text class="s" x="48" y="123">새 메시지 + 열린 작업</text>
<path class="line" d="M280 104 H344"/><rect class="box" x="350" y="66" width="260" height="76" rx="12"/><text class="l" x="370" y="97">관계 판단</text><text class="s" x="370" y="123">보충 / 정정 / 독립 등</text>
<path class="line" d="M480 142 V184 H320 V207"/>
<rect x="60" y="214" width="520" height="94" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="l" x="82" y="247">요청 브랜치 · req/n</text><text class="s" x="82" y="276">claim 수정 → 의존성 무효화 → 단계 커밋</text>
<path class="line" d="M320 308 V327 H155 V343"/>
<rect class="box" x="30" y="350" width="250" height="96" rx="12"/><text class="l" x="50" y="381">main · 상태 병합</text><text class="s" x="50" y="410">base / main / req 비교</text><text class="s" x="50" y="433">유형 규칙 + 필요시 판단</text>
<path class="line" d="M280 397 H343"/><rect class="box" x="350" y="350" width="260" height="96" rx="12"/><text class="l" x="370" y="381">answers · 답변 이력</text><text class="s" x="370" y="410">answer.txt + 기준 커밋</text><text class="s" x="370" y="433">중간 답변도 별도 기록</text></svg>