<svg xmlns="http://www.w3.org/2000/svg" width="390" height="470" viewBox="0 0 390 470" role="img" aria-labelledby="title desc"><title id="title">하네스 생성과 구조 평가</title><desc id="desc">대상 프로젝트를 탐지해 하네스 파일을 생성합니다. 별도 검사 명령은 파일 구조를 읽어 점수와 보고서를 만듭니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="390" height="470" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172554"><text x="195" y="34" font-size="23" font-weight="bold">생성 → 구조 평가</text><g stroke="#94a3b8" fill="#fff"><rect x="15" y="55" width="360" height="70" rx="10"/><rect x="15" y="156" width="360" height="70" rx="10"/><rect x="15" y="257" width="360" height="70" rx="10"/><rect x="15" y="358" width="360" height="70" rx="10"/></g><text x="195" y="84" font-size="21">프로젝트 파일 탐지</text><text x="195" y="110" font-size="17">manifest · 잠금 파일 → 검증 명령</text><text x="195" y="185" font-size="21">create-harness</text><text x="195" y="211" font-size="17">지침 · 상태 · 인수인계 · init.sh 생성</text><text x="195" y="286" font-size="21">validate / benchmark</text><text x="195" y="312" font-size="17">파일 · 문자열 · JSON 구조 검사</text><text x="195" y="387" font-size="21">다섯 영역 점수와 보고서</text><text x="195" y="413" font-size="17">CLI · JSON · HTML</text><text x="195" y="456" font-size="16">모델 실행과 실제 기능 검증은 별도입니다.</text></g><g stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M195 128V149"/><path d="M195 229V250"/><path d="M195 330V351"/></g></svg>