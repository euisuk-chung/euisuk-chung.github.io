<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope의 콘솔과 ReAct 루프</title>
  <desc id="desc">콘솔이 사용자 메시지를 전달하면 Agent는 대화와 도구 스키마로 모델을 호출한다. 도구 요청은 Toolkit 실행 후 결과를 대화에 돌려보내며, 완결 메시지가 나오면 콘솔에 종료 이벤트가 표시된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#155a8a"/>
    </marker>
    <marker id="return" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#18705a"/>
    </marker>
  </defs>
  <rect width="640" height="430" rx="18" fill="#f4f8fc" stroke="#c8d8e8"/>
  <g font-family="system-ui, Apple SD Gothic Neo, sans-serif" fill="#183453">
    <text x="32" y="41" font-size="27" font-weight="700">콘솔 입력에서 응답까지</text>
    <g stroke="#155a8a" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M320 114V138"/>
      <path d="M320 201V229"/>
      <path d="M270 293V317H165V340"/>
      <path d="M370 293V317H474V340"/>
    </g>
    <path d="M32 375H17V171H38" stroke="#18705a" stroke-width="3" fill="none" marker-end="url(#return)"/>
    <rect x="38" y="58" width="564" height="56" rx="11" fill="#e2eefb" stroke="#9ab8d7"/>
    <rect x="38" y="138" width="564" height="63" rx="11" fill="#e2eefb" stroke="#9ab8d7"/>
    <rect x="38" y="229" width="564" height="64" rx="11" fill="#fff" stroke="#9ab8d7"/>
    <rect x="32" y="340" width="266" height="70" rx="11" fill="#e1f3ed" stroke="#75af9b"/>
    <rect x="342" y="340" width="266" height="70" rx="11" fill="#e2eefb" stroke="#9ab8d7"/>
    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="320" y="94">콘솔 입력 · UserMsg</text>
      <text x="320" y="165">Agent · 모델 입력 구성</text>
      <text x="320" y="256">DashScope · 모델 호출</text>
      <text x="165" y="368">도구 호출 있음</text>
      <text x="475" y="368">최종 응답 생성</text>
    </g>
    <g text-anchor="middle" font-size="18" fill="#324f6c">
      <text x="320" y="189">시스템 프롬프트 · 대화 · 도구 스키마</text>
      <text x="320" y="281">응답 조각을 이벤트로 전달</text>
      <text x="165" y="394">권한 확인 · 결과를 대화에 추가</text>
      <text x="475" y="394">ReplyEndEvent → 콘솔</text>
    </g>
  </g>
</svg>
