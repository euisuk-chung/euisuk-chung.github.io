<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">도구 승인 대기와 응답 취소</title>
  <desc id="desc">도구 승인 요청은 ASKING 상태를 남겨 승인 결과로 같은 응답을 이어간다. 응답 취소 시 미완료 도구에 INTERRUPTED 결과를 남기고 현재 응답을 끝낸다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#155a8a"/>
    </marker>
  </defs>
  <rect width="640" height="360" rx="18" fill="#f4f8fc" stroke="#c8d8e8"/>
  <g font-family="system-ui, Apple SD Gothic Neo, sans-serif" fill="#183453">
    <text x="32" y="44" font-size="27" font-weight="700">도구 승인을 기다릴 때와 취소할 때</text>
    <g stroke="#155a8a" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M170 143V170"/>
      <path d="M470 143V170"/>
      <path d="M170 241V268"/>
      <path d="M470 241V268"/>
    </g>
    <g stroke="#99b6d4" fill="#e2eefb">
      <rect x="32" y="74" width="276" height="69" rx="11"/>
      <rect x="32" y="170" width="276" height="71" rx="11"/>
      <rect x="32" y="268" width="276" height="69" rx="11"/>
    </g>
    <g stroke="#cda768" fill="#fff2dc">
      <rect x="332" y="74" width="276" height="69" rx="11"/>
      <rect x="332" y="170" width="276" height="71" rx="11"/>
      <rect x="332" y="268" width="276" height="69" rx="11"/>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="170" y="101">도구 승인 필요</text>
      <text x="470" y="101">현재 응답 취소</text>
      <text x="170" y="198">승인 결과 입력</text>
      <text x="470" y="198">미완료 도구 정리</text>
      <text x="170" y="296">같은 응답을 이어감</text>
      <text x="470" y="296">현재 응답 종료</text>
    </g>
    <g text-anchor="middle" font-size="18" fill="#324f6c">
      <text x="170" y="126">호출 상태를 ASKING으로 기록</text>
      <text x="470" y="126">스트리밍 중 Ctrl+C 등</text>
      <text x="170" y="224">대기 중인 호출 ID 대조</text>
      <text x="470" y="224">INTERRUPTED 결과 보존</text>
      <text x="170" y="321">승인된 도구 실행</text>
      <text x="470" y="321">다음 입력은 새 응답</text>
    </g>
  </g>
</svg>
