    <g text-anchor="middle">
      <g font-size="21" font-weight="700">
        <text x="400" y="101">공개 세트와 시나리오</text>
        <text x="400" y="196">Alone · 단독 실행</text>
        <text x="209" y="311">Baseline · 평상시 팀</text>
        <text x="591" y="311">Test · 문제가 생긴 팀</text>
        <text x="400" y="430">체커가 대화와 행동 기록을 판정</text>
        <text x="400" y="534">Test 집계 · 시드 → 문항 → 영역 평균</text>
      </g>
      <g font-size="17" fill="#40516a">
        <text x="400" y="124">final_set.json · episode.yaml · record.json</text>
        <text x="400" y="219">seed 0 · 통과하면 팀 실행</text>
        <text x="680" y="194">단독 미통과</text>
        <text x="680" y="217">팀 실행 생략</text>
        <text x="209" y="336">seed 0 · 평상시 스크립트</text>
        <text x="591" y="336">seed 0·1·2 · 반응별 분기</text>
        <text x="400" y="454">발언 · 분류 라벨 · 실행 상태 · 최종 답변</text>
