<rect x="100" y="1191" width="520" height="96" rx="14" fill="#e4f5ee"/>
</g>
<g font-size="24" font-weight="700">
<text x="360" y="144">사용자 입력 + 대화 이력</text>
<text x="360" y="261">턴 진입 조율</text>
<text x="360" y="389">요청 조립 · 압축 사전 검사</text>
<text x="360" y="529">모델 응답 정규화</text>
<text x="360" y="673">도구 호출을 SQLite에 저장</text>
<text x="360" y="801">도구 실행</text>
<text x="360" y="930">결과 기록 · SQLite 저장</text>
<text x="360" y="1080">종료 처리와 응답 반환</text>
<text x="360" y="1228">조건부 메모리 · 스킬 검토</text>
</g>
<g font-size="19">
<text x="360" y="173">hermes CLI → AIAgent.run_conversation</text>
<text x="360" y="290">TurnFacade · 세션 실행 lease</text>
<text x="360" y="421">모델 API 호출 · 재시도</text>
<text x="360" y="558">tool_calls 유무로 다음 단계 분기</text>
<text x="360" y="704">저장 실패 시 실행하지 않고 턴 종료</text>
<text x="360" y="832">경로 충돌에 따라 순차 / 병렬 구간 구성</text>
<text x="360" y="959">기록된 도구 결과를 다음 요청에 사용</text>
<text x="360" y="1111">세션 저장 · final_response → CLI / UI</text>
<text x="360" y="1260">간격 · 도구 가용성 · 실행 설정 조건 검사</text>
</g>
</g>
