<g font-family="sans-serif" text-anchor="middle" fill="#152b45">
<text x="360" y="48" font-size="28" font-weight="700">Hermes Agent: 대화 실행과 기록</text>
<text x="360" y="80" font-size="19">일반 대화 경로 · 분석 커밋 cbd03e6</text>
<g stroke="#a3b6cc" stroke-width="2" fill="#ffffff">
<rect x="100" y="110" width="520" height="82" rx="14"/>
<rect x="100" y="226" width="520" height="90" rx="14"/>
