<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="title desc">
<title id="title">Hermes Agent 대화와 도구 실행 흐름</title>
<desc id="desc">CLI 입력, 턴 진입, 모델 요청과 응답, 도구 호출 기록 저장, 실행과 결과 저장, 대화 루프 복귀, 최종 응답 및 조건부 기억 검토를 나타냅니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4c6079"/></marker></defs>
