<svg xmlns="http://www.w3.org/2000/svg" width="620" height="475" viewBox="0 0 620 475" role="img"><style>text{font-family:Arial,Apple SD Gothic Neo,Noto Sans KR,sans-serif;fill:#18304b} .h{font-size:25px;font-weight:700}.b{font-size:23px;font-weight:700}.s{font-size:19px}.a{stroke:#62758a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62758a"/></marker></defs><rect width="620" height="475" rx="15" fill="#f6f8fb"/><title>시각 의견의 조건부 융합과 명시적 사용자 정정</title><text class="h" x="310" y="34" text-anchor="middle">의견을 합치되 근거의 경계를 보존</text>
<rect x="28" y="55" width="184" height="68" rx="12" fill="#dceafe" stroke="#9aafc7"/><text class="b" x="120" y="83" text-anchor="middle">도구 점수</text><text class="s" x="120" y="109" text-anchor="middle">시간·질감·출처</text>
<rect x="240" y="55" width="352" height="68" rx="12" fill="#fff0cb" stroke="#9aafc7"/><text class="b" x="416" y="83" text-anchor="middle">VLM / 에이전트 검토</text><text class="s" x="416" y="109" text-anchor="middle">두 시각 의견이면 분포 평균</text>
<path class="a" d="M416 124V142"/><rect x="240" y="145" width="352" height="62" rx="12" fill="#fff0cb" stroke="#9aafc7"/><text class="b" x="416" y="172" text-anchor="middle">단일 시각 의견: gate</text><text class="s" x="416" y="196" text-anchor="middle">조건에 맞지 않으면 제외</text>
<path class="a" d="M120 124V224H274V239"/><path class="a" d="M416 208V224H348V239"/>
<rect x="76" y="242" width="468" height="69" rx="12" fill="#e0f4ef" stroke="#9aafc7"/><text class="b" x="310" y="271" text-anchor="middle">그룹 융합 · 시간 제약 · majority</text><text class="s" x="310" y="298" text-anchor="middle">시각 의견이 없으면 도구 상위 종류 사용</text><path class="a" d="M310 312V330"/>
<rect x="76" y="333" width="468" height="48" rx="12" fill="#dceafe" stroke="#9aafc7"/><text class="b" x="310" y="364" text-anchor="middle">사용자 명시 정정이 있으면 직접 적용</text><path class="a" d="M310 382V400"/>
<rect x="76" y="403" width="468" height="49" rx="12" fill="#e0f4ef" stroke="#9aafc7"/><text class="s" x="310" y="434" text-anchor="middle">최종 종류 · 신뢰 점수 · 근거 · 불확실성</text></svg>
