<svg xmlns="http://www.w3.org/2000/svg" width="440" height="464" viewBox="0 0 440 464" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Agent Harness의 카탈로그 유지보수 흐름</title>
  <desc id="desc">GitHub API에서 받은 정보를 동기화 스크립트가 YAML 목록에 쓰고, 렌더러가 영어와 중국어 README를 만듭니다. 검증기는 YAML과 두 README를 읽어 구조, 일치 여부와 링크를 검사한 결과를 보고서에 기록합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#476075"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="462" rx="17" fill="#f8fafc" stroke="#c7d8e3" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#152e42">
    <rect x="78" y="14" width="284" height="42" rx="9" fill="#e7efff" stroke="#a7bcdd"/>
    <text x="220" y="42" font-size="21" font-weight="620">GitHub API / CLI</text>

    <path d="M220 56V74" fill="none" stroke="#476075" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="35" y="81" width="370" height="51" rx="9" fill="#e7efff" stroke="#a7bcdd"/>
    <text x="220" y="104" font-size="20" font-weight="600">메타데이터 동기화</text>
    <text x="220" y="123" font-size="16">별·활동일·라이선스</text>

    <path d="M220 132V151" fill="none" stroke="#476075" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="34" y="158" width="306" height="56" rx="9" fill="#d9f3ee" stroke="#82bcb0"/>
    <text x="187" y="182" font-size="20" font-weight="650">data/projects.yaml</text>
    <text x="187" y="202" font-size="17">분류와 항목의 편집 원본</text>

    <path d="M187 214V248" fill="none" stroke="#476075" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="254" y="238" font-size="18">문서 생성</text>
    <rect x="34" y="255" width="306" height="49" rx="9" fill="#e7efff" stroke="#a7bcdd"/>
    <text x="187" y="286" font-size="20" font-weight="600">영어·중국어 README</text>

    <path d="M187 304V334M340 188H382V311Q382 325 367 325H263V334" fill="none" stroke="#476075" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="45" y="341" width="350" height="52" rx="9" fill="#fff1d9" stroke="#d0ad67"/>
    <text x="220" y="365" font-size="20" font-weight="650">구조·문서·링크 검증</text>
    <text x="220" y="385" font-size="17">YAML과 README를 함께 읽음</text>

    <path d="M220 393V410" fill="none" stroke="#476075" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="74" y="416" width="292" height="34" rx="9" fill="#fff1d9" stroke="#d0ad67"/>
    <text x="220" y="440" font-size="19" font-weight="620">날짜별 보고서와 종료 상태</text>
  </g>
</svg>
