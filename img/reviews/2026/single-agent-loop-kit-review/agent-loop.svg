<svg xmlns="http://www.w3.org/2000/svg" width="560" height="610" viewBox="0 0 560 610" role="img" aria-labelledby="title desc">
  <title id="title">Single Agent Loop Kit의 참조 실행 루프</title>
  <desc id="desc">사용자 메시지를 받은 메인 모델이 필요에 따라 스킬을 로드하고 읽기 도구를 병렬 실행합니다. 쓰기 도구는 승인 뒤 순서대로 실행하며, 모든 도구 결과가 같은 모델로 돌아갑니다. 최종 응답에는 선택적 검증을 붙일 수 있습니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4b688a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="558" height="608" rx="18" fill="#f8fafc" stroke="#d7e0eb" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" fill="#18314f" text-anchor="middle">
    <text x="280" y="45" font-size="26" font-weight="700">참조 에이전트 루프</text>
    <rect x="172" y="70" width="216" height="46" rx="11" fill="#fff" stroke="#aebdd0" stroke-width="2"/>
    <text x="280" y="99" font-size="20" font-weight="600">사용자 메시지</text>
    <path d="M280 116V137" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="125" y="143" width="310" height="71" rx="12" fill="#dbeafe" stroke="#83a7d6" stroke-width="2"/>
    <text x="280" y="173" font-size="23" font-weight="700">메인 모델 호출</text>
    <text x="280" y="198" font-size="18">대화 이력과 스킬 설명</text>

    <path d="M208 214V258" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M357 214V237H448V258" fill="none" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="86" y="263" width="244" height="66" rx="11" fill="#e0f2fe" stroke="#83a7d6" stroke-width="2"/>
    <text x="208" y="291" font-size="22" font-weight="700">도구 호출 묶음</text>
    <text x="208" y="314" font-size="17">기본 한도 16건</text>
    <rect x="366" y="263" width="164" height="66" rx="11" fill="#dcfce7" stroke="#89b99e" stroke-width="2"/>
    <text x="448" y="291" font-size="22" font-weight="700">최종 답변</text>
    <text x="448" y="314" font-size="17">선택적 검증</text>

    <path d="M208 329V354" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="86" y="360" width="244" height="63" rx="11" fill="#fff" stroke="#aebdd0" stroke-width="2"/>
    <text x="208" y="386" font-size="21" font-weight="700">읽기 도구 병렬 실행</text>
    <text x="208" y="409" font-size="17">스킬 본문 읽기 포함</text>

    <path d="M208 423V448" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="86" y="454" width="244" height="63" rx="11" fill="#fff2dc" stroke="#cdab68" stroke-width="2"/>
    <text x="208" y="480" font-size="21" font-weight="700">쓰기 도구 순차 실행</text>
    <text x="208" y="503" font-size="17">각 호출 전 승인 확인</text>

    <path d="M208 517V542" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="86" y="548" width="244" height="42" rx="10" fill="#dbeafe" stroke="#83a7d6" stroke-width="2"/>
    <text x="208" y="575" font-size="20" font-weight="700">도구 결과를 이력에 추가</text>
    <path d="M86 569H49V178H119" fill="none" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M448 329V348" stroke="#4b688a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="366" y="354" width="164" height="50" rx="11" fill="#fff" stroke="#89b99e" stroke-width="2"/>
    <text x="448" y="386" font-size="20" font-weight="600">응답 반환</text>
  </g>
</svg>
