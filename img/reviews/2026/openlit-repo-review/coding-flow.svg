<text x="220" y="32" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="700">Codex 훅에서 세션 trace까지</text>
<rect x="24" y="54" width="186" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="117.0" y="79.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">훅 JSON</text>
<text x="117.0" y="103.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">stdin</text>
<rect x="230" y="54" width="186" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="323.0" y="79.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">sessionstate</text>
<text x="323.0" y="103.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">로컬 JSON</text>
<rect x="24" y="150" width="392" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="220.0" y="175.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">Codex adapter</text>
<text x="220.0" y="199.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">tool 즉시 · turn은 Stop에서</text>
<rect x="24" y="248" width="392" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="220.0" y="273.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">OTLP emitter</text>
<text x="220.0" y="297.0" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">세션·vendor → 공통 Trace ID</text>
