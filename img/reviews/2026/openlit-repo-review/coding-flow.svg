<svg xmlns="http://www.w3.org/2000/svg" width="440" height="448" viewBox="0 0 440 448" role="img" aria-labelledby="title desc"><title id="title">Codex 훅에서 세션 trace까지</title><desc id="desc">훅 JSON과 sessionstate를 adapter가 사용해 session, tool call, LLM turn, event를 정규화합니다. emitter가 세션과 vendor로 정한 Trace ID를 공유하는 자식 span을 OTLP로 보냅니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
