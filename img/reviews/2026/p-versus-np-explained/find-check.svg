<svg xmlns="http://www.w3.org/2000/svg" width="600" height="335" viewBox="0 0 600 335"><rect width="600" height="335" rx="16" fill="#f4f7fb"/><g fill="#17243c" font-family="Arial, sans-serif"><text x="300" y="34" text-anchor="middle" font-size="25" font-weight="bold">합 27을 만드는 카드를 고르세요</text><rect x="35" y="62" width="78" height="64" rx="9" fill="#e2e8f0"/><text x="74" y="104" text-anchor="middle" font-size="29">3</text><rect x="125" y="62" width="78" height="64" rx="9" fill="#e2e8f0"/><text x="164" y="104" text-anchor="middle" font-size="29">5</text><rect x="215" y="62" width="78" height="64" rx="9" fill="#bfdbfe"/><text x="254" y="104" text-anchor="middle" font-size="29">8</text><rect x="305" y="62" width="78" height="64" rx="9" fill="#e2e8f0"/><text x="344" y="104" text-anchor="middle" font-size="29">12</text><rect x="395" y="62" width="78" height="64" rx="9" fill="#e2e8f0"/><text x="434" y="104" text-anchor="middle" font-size="29">14</text><rect x="485" y="62" width="78" height="64" rx="9" fill="#bfdbfe"/><text x="524" y="104" text-anchor="middle" font-size="29">19</text><rect x="35" y="155" width="530" height="65" rx="9" fill="#e0e7ff"/><text x="300" y="181" text-anchor="middle" font-size="23" font-weight="bold">찾기: 어떤 카드를 고를까?</text><text x="300" y="207" text-anchor="middle" font-size="20">여러 조합 중 조건에 맞는 답을 찾기</text><rect x="35" y="240" width="530" height="65" rx="9" fill="#d1fae5"/><text x="300" y="266" text-anchor="middle" font-size="23" font-weight="bold">확인: 8 + 19 = 27</text><text x="300" y="293" text-anchor="middle" font-size="20">주어진 두 카드가 답인지 검사하기</text></g></svg>