<svg xmlns="http://www.w3.org/2000/svg" width="600" height="352" viewBox="0 0 600 352"><rect width="600" height="352" rx="16" fill="#f4f7fb"/><g fill="#17243c" font-family="Arial, sans-serif"><text x="150" y="35" text-anchor="middle" font-size="24" font-weight="bold">Y: P=NP</text><text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold">N: P≠NP</text><circle cx="150" cy="160" r="104" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150" y="160" text-anchor="middle" font-size="30" font-weight="bold">P = NP</text><circle cx="450" cy="160" r="104" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><text x="450" y="95" text-anchor="middle" font-size="25">NP</text><ellipse cx="425" cy="183" rx="60" ry="55" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="425" y="191" text-anchor="middle" font-size="26">P</text><circle cx="512" cy="130" r="5" fill="#c2410c"/><text x="512" y="154" text-anchor="middle" font-size="16">SAT</text><text x="150" y="297" text-anchor="middle" font-size="19">효율적 검증의 범위와</text><text x="150" y="324" text-anchor="middle" font-size="19">효율적 판정의 범위가 같음</text><text x="450" y="297" text-anchor="middle" font-size="19">NP의 일부 문제는</text><text x="450" y="324" text-anchor="middle" font-size="19">P 바깥에 남음</text></g></svg>