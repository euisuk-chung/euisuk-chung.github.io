<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480" role="img" aria-labelledby="title desc"><title id="title">숫자는 객체로 이어집니다</title><desc id="desc">가격 데이터 구조화 결과를 호출 ID로 저장하고 참조 해석 후 입력 검증과 상관 계산을 수행합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="420" height="480" rx="14" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="210" y="30" font-size="21" font-weight="700">숫자는 객체로 이어집니다</text><rect x="38" y="48" width="344" height="62" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="210" y="73" font-size="19" font-weight="700">가격 조회 → bars</text><text x="210" y="96" font-size="17">yfinance → 날짜 · OHLCV</text><path d="M210 112 V128" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="132" width="344" height="62" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="210" y="157" font-size="19" font-weight="700">호출 ID로 결과 저장</text><text x="210" y="180" font-size="17">tool_results[id] = structured</text><path d="M210 196 V212" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="216" width="344" height="62" rx="10" fill="#ccfbf1" stroke="#94a3b8"/><text x="210" y="241" font-size="19" font-weight="700">prev 참조 치환</text><text x="210" y="264" font-size="17">bars[*].close → 종가 배열</text><path d="M210 280 V296" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="300" width="344" height="62" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="210" y="325" font-size="19" font-weight="700">입력 스키마 검증</text><text x="210" y="348" font-size="17">series: 이름별 숫자 배열</text><path d="M210 364 V380" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="384" width="344" height="62" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="210" y="409" font-size="19" font-weight="700">상관 계산 → 결과</text><text x="210" y="432" font-size="17">수익률 · 길이 정렬 · 상관행렬</text><text x="210" y="470" font-size="14" fill="#475569">FinanceHarness · 분석 커밋 1163c5e7</text></g></svg>