<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480" role="img" aria-labelledby="title desc"><title id="title">질문에서 보고서까지</title><desc id="desc">도구가 실행되면 결과를 다음 모델 호출로 돌려보냅니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="420" height="480" rx="14" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#0f172a"><text x="210" y="30" font-size="21" font-weight="700">질문에서 보고서까지</text><rect x="38" y="48" width="344" height="62" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="210" y="73" font-size="19" font-weight="700">CLI / HTTP 입력</text><text x="210" y="96" font-size="17">질문 · 모드 · 프로필</text><path d="M210 112 V128" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="132" width="344" height="62" rx="10" fill="#e0e7ff" stroke="#94a3b8"/><text x="210" y="157" font-size="19" font-weight="700">run_research</text><text x="210" y="180" font-size="17">캐시 · 도구 · 스킬 조립</text><path d="M210 196 V212" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="216" width="344" height="62" rx="10" fill="#ccfbf1" stroke="#94a3b8"/><text x="210" y="241" font-size="19" font-weight="700">Agent → 모델 API</text><text x="210" y="264" font-size="17">공개된 스키마로 다음 행동 선택</text><path d="M210 280 V296" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="300" width="344" height="62" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="210" y="325" font-size="19" font-weight="700">dispatch → 도구</text><text x="210" y="348" font-size="17">웹 · yfinance · 로컬 계산</text><rect x="38" y="384" width="344" height="62" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="210" y="409" font-size="19" font-weight="700">답변 종료 시</text><text x="210" y="432" font-size="17">인용 정리 → 보고서 / trajectory</text><text x="210" y="470" font-size="14" fill="#475569">FinanceHarness · 분석 커밋 1163c5e7</text><path d="M382 331 H403 V246 H382" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M38 247 H17 V415 H38" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>