<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="파일 검사, 네 단계로 읽기">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5a6d82"/></marker></defs>
<rect width="640" height="480" rx="18" fill="#f5f8fc"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle" fill="#213b58">
<text x="320" y="34" font-size="24" font-weight="700">파일 검사, 네 단계로 읽기</text>
<rect x="55" y="55" width="530" height="69" rx="10" fill="#e2edff" stroke="#b6c9db"/>
<text x="320" y="82" font-size="22" font-weight="700">1. 엔진 준비</text>
<text x="320" y="108" font-size="18">옵션 → DB 적재 → 검사 자료구조 준비</text>
<path d="M320 126 V142" fill="none" stroke="#5a6d82" stroke-width="3" marker-end="url(#arr)"/>
<rect x="55" y="146" width="530" height="69" rx="10" fill="#e7f3ed" stroke="#b6c9db"/>
<text x="320" y="173" font-size="22" font-weight="700">2. 입력 선택</text>
<text x="320" y="199" font-size="18">파일 · 디렉터리 · 표준입력</text>
<path d="M320 217 V233" fill="none" stroke="#5a6d82" stroke-width="3" marker-end="url(#arr)"/>
<rect x="55" y="237" width="530" height="69" rx="10" fill="#e2edff" stroke="#b6c9db"/>
<text x="320" y="264" font-size="22" font-weight="700">3. 내용 검사</text>
<text x="320" y="290" font-size="18">형식 판별 · 파싱 · 시그니처 매칭</text>
<path d="M320 308 V324" fill="none" stroke="#5a6d82" stroke-width="3" marker-end="url(#arr)"/>
<rect x="55" y="328" width="530" height="69" rx="10" fill="#e7f3ed" stroke="#b6c9db"/>
<text x="320" y="355" font-size="22" font-weight="700">4. 결과 집계</text>
<text x="320" y="381" font-size="18">탐지 판정 + 처리 오류 → 출력 · 종료 코드</text>
<text x="320" y="451" font-size="18">clamscan → libclamav → clamscan</text>
</g></svg>
