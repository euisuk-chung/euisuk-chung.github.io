<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc">
  <title id="title">Flash ALOHA의 시연과 자율 실행</title>
  <desc id="desc">작업자가 실제 로봇의 그리퍼 손잡이를 잡고 안내하며 RGB 영상과 관절 자세를 기록합니다. 학습과 배포에 같은 기하 마스크를 적용하고 배포 시 행동 구간을 부드럽게 잇습니다.</desc>
  <rect x="1" y="1" width="758" height="472" rx="24" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle">
    <text x="380" y="54" font-size="32" font-weight="700" fill="#172743">같은 로봇에서 시연하고 실행하기</text>
    <rect x="40" y="82" width="680" height="96" rx="15" fill="#dbeafe" stroke="#6b9cd7"/>
    <text x="380" y="121" font-size="26" font-weight="700" fill="#132c4f">손잡이로 로봇 팔을 직접 움직임</text>
    <text x="380" y="153" font-size="22" fill="#163955">카메라 세 대와 관절 엔코더로 시연 기록</text>
    <rect x="40" y="206" width="680" height="96" rx="15" fill="#ccfbf1" stroke="#49a898"/>
    <text x="380" y="245" font-size="26" font-weight="700" fill="#134e4a">손이 나타나는 영역을 양쪽에서 마스킹</text>
    <text x="380" y="277" font-size="22" fill="#134e4a">관절 자세와 카메라 좌표를 사용해 위치 계산</text>
    <rect x="40" y="330" width="680" height="96" rx="15" fill="#fef3c7" stroke="#c69539"/>
    <text x="380" y="369" font-size="26" font-weight="700" fill="#5a3512">행동 구간을 예측하고 교체 지점에서 혼합</text>
    <text x="380" y="401" font-size="22" fill="#5a3512">저수준 제어기가 목표 관절 위치를 추종</text>
  </g>
  <path d="M380 182v19m-6-7 6 7 6-7M380 306v19m-6-7 6 7 6-7" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
