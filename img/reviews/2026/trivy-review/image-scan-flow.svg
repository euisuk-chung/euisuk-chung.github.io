<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#58718c"/></marker></defs><rect width="640" height="530" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b48"><text x="320" y="36" text-anchor="middle" font-size="27" font-weight="700">이미지에서 결과까지: 역할을 나눠 읽기</text><rect x="35" y="60" width="570" height="84" rx="13" fill="#eef3ff" stroke="#9baec6"/><text x="320" y="93" text-anchor="middle" font-size="26" font-weight="700">1. CLI · 검사 구성</text><text x="320" y="124" text-anchor="middle" font-size="22" fill="#41566c">대상 · 스캐너 · DB · 실행 방식</text><path d="M320 144v20" fill="none" stroke="#58718c" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="168" width="570" height="84" rx="13" fill="#eef3ff" stroke="#9baec6"/><text x="320" y="201" text-anchor="middle" font-size="26" font-weight="700">2. Fanal · 이미지 분석</text><text x="320" y="232" text-anchor="middle" font-size="22" fill="#41566c">레이어의 구성 요소 추출 + 캐시</text><path d="M320 252v20" fill="none" stroke="#58718c" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="276" width="570" height="84" rx="13" fill="#fff1df" stroke="#9baec6"/><text x="320" y="309" text-anchor="middle" font-size="26" font-weight="700">3. OS별 취약점 판정</text><text x="320" y="340" text-anchor="middle" font-size="22" fill="#41566c">배포판 권고 조회 + 버전 비교</text><path d="M320 360v20" fill="none" stroke="#58718c" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="384" width="570" height="84" rx="13" fill="#eef3ff" stroke="#9baec6"/><text x="320" y="417" text-anchor="middle" font-size="26" font-weight="700">4. 결과 처리</text><text x="320" y="448" text-anchor="middle" font-size="22" fill="#41566c">필터 → 보고서 → 종료 조건</text><text x="320" y="513" text-anchor="middle" font-size="20" fill="#52657c">일반 레이어 분석 · standalone 경로</text></g></svg>