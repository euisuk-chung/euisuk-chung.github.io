<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#58718c"/></marker></defs><rect width="640" height="530" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b48"><text x="320" y="36" text-anchor="middle" font-size="27" font-weight="700">발견 여부와 종료 코드는 다릅니다</text><rect x="35" y="60" width="570" height="84" rx="13" fill="#eef3ff" stroke="#9baec6"/><text x="320" y="93" text-anchor="middle" font-size="25" font-weight="700">검출된 결과</text><text x="320" y="124" text-anchor="middle" font-size="21" fill="#41566c">패키지·취약점 등 구조화된 정보</text><path d="M320 144v23" fill="none" stroke="#58718c" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="172" width="570" height="84" rx="13" fill="#eef3ff" stroke="#9baec6"/><text x="320" y="205" text-anchor="middle" font-size="25" font-weight="700">필터 적용 → 보고서 쓰기</text><text x="320" y="236" text-anchor="middle" font-size="21" fill="#41566c">심각도 · 예외 · 출력 형식 반영</text><path d="M320 256v31M320 287H170v30M320 287H470v30" fill="none" stroke="#58718c" stroke-width="3"/><rect x="25" y="317" width="280" height="124" rx="13" fill="#fff1df" stroke="#b8a58c"/><text x="165" y="352" text-anchor="middle" font-size="25" font-weight="700">--exit-code = 0</text><text x="165" y="388" text-anchor="middle" font-size="21">발견이 있어도</text><text x="165" y="418" text-anchor="middle" font-size="21">그 조건으로는 실패 안 함</text><rect x="335" y="317" width="280" height="124" rx="13" fill="#fff1df" stroke="#b8a58c"/><text x="475" y="352" text-anchor="middle" font-size="25" font-weight="700">--exit-code ≠ 0</text><text x="475" y="388" text-anchor="middle" font-size="21">필터 후 발견이 있으면</text><text x="475" y="418" text-anchor="middle" font-size="21">지정 코드로 종료</text><text x="320" y="477" text-anchor="middle" font-size="20" fill="#52657c">실행 오류와 --exit-on-eol 조건은 별도</text><text x="320" y="511" text-anchor="middle" font-size="20" fill="#52657c">정상 종료만으로 안전성을 단정할 수 없음</text></g></svg>