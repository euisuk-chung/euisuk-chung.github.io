<svg xmlns="http://www.w3.org/2000/svg" width="360" height="438" viewBox="0 0 360 438" role="img" aria-labelledby="title desc"><title id="title">검색 순서와 Context Precision</title><desc id="desc">D1과D2는 관련 문서이며 D3는 무관한 문서입니다. A의순서는D1,D2,D3이고 B는D3,D1,D2입니다. Precision@3은모두2/3이지만 순위를반영한ContextPrecision은각각1과7/12입니다.</desc><rect width="360" height="438" rx="16" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#172033"><text x="180" y="32" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">같은 문서, 다른 순서</text><text x="180" y="56" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">D1·D2 관련 / D3 무관으로 고정</text><text x="95" y="88" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">A: 관련 청크 먼저</text><rect x="20" y="104" width="150" height="42" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="95" y="131" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">1. D1 한도</text><rect x="20" y="156" width="150" height="42" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="95" y="183" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">2. D2 승인</text><rect x="20" y="208" width="150" height="42" rx="10" fill="#e9edf3" stroke="#b4bfce"/><text x="95" y="235" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">3. D3 도서관</text><text x="95" y="285" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">Precision@3 = 2/3</text><text x="265" y="88" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">B: 무관 청크 먼저</text><rect x="190" y="104" width="150" height="42" rx="10" fill="#e9edf3" stroke="#b4bfce"/><text x="265" y="131" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">1. D3 도서관</text><rect x="190" y="156" width="150" height="42" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="265" y="183" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">2. D1 한도</text><rect x="190" y="208" width="150" height="42" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="265" y="235" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">3. D2 승인</text><text x="265" y="285" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">Precision@3 = 2/3</text><rect x="20" y="308" width="150" height="78" rx="10" fill="#eaf2ff" stroke="#9eb6e1"/><rect x="190" y="308" width="150" height="78" rx="10" fill="#eaf2ff" stroke="#9eb6e1"/><text x="95" y="331" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">순위를 반영한 CP</text><text x="95" y="353" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">(1 + 1) / 2</text><text x="95" y="376" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">= 1.00</text><text x="265" y="331" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">순위를 반영한 CP</text><text x="265" y="353" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">(1/2 + 2/3) / 2</text><text x="265" y="376" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">≈ 0.58</text><text x="180" y="414" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">사람이 관련성을 정한 설명용 계산</text></g></svg>