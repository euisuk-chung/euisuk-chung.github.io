<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490" role="img" aria-labelledby="title desc"><title id="title">RAG의 흐름과 평가 질문</title><desc id="desc">질문에서 검색한 문맥을 모델에 전달해 답변을 생성합니다. 질문과 문맥의 관련성, 문맥과 답변의 근거 충실도, 질문과 답변의 관련성을 따로 평가합니다.</desc><rect width="360" height="490" rx="16" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#172033"><text x="180" y="30" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">자료를 찾는 단계와 답하는 단계</text><rect x="28" y="49" width="304" height="48" rx="10" fill="#eaf2ff" stroke="#9eb6e1"/><text x="180" y="70" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">사용자 질문</text><text x="180" y="89" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">“한도와 사전 승인자는?”</text><path d="M44 98L44 125" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="180" y="118" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">검색기: 문서에서 청크 찾기</text><rect x="28" y="132" width="304" height="67" rx="10" fill="#fff2dd" stroke="#d5b785"/><text x="180" y="155" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">실제로 전달한 문맥</text><text x="180" y="180" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">D1 한도 · D2 승인 · D3 도서관</text><path d="M44 201L44 229" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/><text x="180" y="221" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">생성 모델: 문맥을 보고 작성</text><rect x="28" y="237" width="304" height="50" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="180" y="259" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">생성 답변</text><text x="180" y="279" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">“100만 원, 팀장 사전 승인”</text><rect x="18" y="309" width="324" height="49" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="31" y="329" font-size="14" font-weight="700" fill="#172033" text-anchor="start">질문 ↔ 문맥</text><text x="31" y="349" font-size="14" font-weight="400" fill="#172033" text-anchor="start">필요한 자료를 찾았나요?</text><rect x="18" y="365" width="324" height="49" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="31" y="385" font-size="14" font-weight="700" fill="#172033" text-anchor="start">문맥 ↔ 답변</text><text x="31" y="405" font-size="14" font-weight="400" fill="#172033" text-anchor="start">근거 없는 주장을 보탰나요?</text><rect x="18" y="421" width="324" height="49" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="31" y="441" font-size="14" font-weight="700" fill="#172033" text-anchor="start">질문 ↔ 답변</text><text x="31" y="461" font-size="14" font-weight="400" fill="#172033" text-anchor="start">질문의 요구에 답했나요?</text></g></svg>