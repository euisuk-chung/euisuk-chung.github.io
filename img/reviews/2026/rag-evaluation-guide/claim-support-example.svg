<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">답변 주장별 근거 점검</title><desc id="desc">가상 답변의 한도100만원 주장은 D1이, 팀장사전승인 주장은 D2가 뒷받침합니다. 영수증 면제 주장은 근거가 없습니다. 세 주장으로 나누면 수작업 충실도는2/3입니다.</desc><rect width="360" height="420" rx="16" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#172033"><text x="180" y="32" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">답변을 주장 단위로 나누면</text><text x="180" y="56" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">가상 규정 · 수작업 예시</text><rect x="20" y="77" width="320" height="70" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="41" y="103" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">1</text><text x="62" y="103" font-size="15" font-weight="700" fill="#172033" text-anchor="start">연간 한도는 100만 원</text><text x="62" y="129" font-size="14" font-weight="400" fill="#172033" text-anchor="start">D1에서 확인 → 근거 있음</text><rect x="20" y="163" width="320" height="70" rx="10" fill="#e7f5ee" stroke="#8fbca4"/><text x="41" y="189" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">2</text><text x="62" y="189" font-size="15" font-weight="700" fill="#172033" text-anchor="start">팀장 사전 승인이 필요</text><text x="62" y="215" font-size="14" font-weight="400" fill="#172033" text-anchor="start">D2에서 확인 → 근거 있음</text><rect x="20" y="249" width="320" height="70" rx="10" fill="#fff0ea" stroke="#d6a78f"/><text x="41" y="275" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">3</text><text x="62" y="275" font-size="15" font-weight="700" fill="#172033" text-anchor="start">영수증은 내지 않아도 됨</text><text x="62" y="301" font-size="14" font-weight="400" fill="#172033" text-anchor="start">D1·D2에 없음 → 근거 없음</text><text x="180" y="354" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">근거 있는 주장 2개 / 전체 주장 3개</text><text x="180" y="382" font-size="22" font-weight="700" fill="#285c49" text-anchor="middle">2/3 ≈ 0.67</text><text x="180" y="405" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">실제 도구 실행 점수가 아닙니다.</text></g></svg>