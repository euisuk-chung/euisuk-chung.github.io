<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#62718a"/></marker></defs><rect width="640" height="470" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" fill="#18314e" text-anchor="middle"><text x="320" y="38" font-size="25" font-weight="700">경험을 어디에, 어떤 형태로 남길까요?</text><rect x="65" y="60" width="510" height="74" rx="12" fill="#e4edff" stroke="#9ab4df"/><text x="320" y="91" font-size="25" font-weight="700">문제 + 응답 형식</text><text x="320" y="119" font-size="21">숨겨진 과제 라벨·평가 보상은 제외</text><path d="M320 135v24" stroke="#62718a" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="165" width="510" height="95" rx="12" fill="#fff0dc" stroke="#d9b77b"/><text x="320" y="196" font-size="25" font-weight="700">라우터의 두 결정</text><text x="320" y="225" font-size="22">어떤 기억 방식? + 어느 클러스터?</text><text x="320" y="250" font-size="19">기존 상태 재사용 또는 새 상태 생성</text><path d="M320 261v24" stroke="#62718a" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="291" width="510" height="76" rx="12" fill="#e4f3ee" stroke="#8bb7a7"/><text x="320" y="322" font-size="24" font-weight="700">어댑터 → 문맥 → 기존 에이전트</text><text x="320" y="350" font-size="21">원래 도구·응답 형식·최종 제출 주체 유지</text><path d="M320 368v23" stroke="#62718a" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="421" font-size="24" font-weight="700">실행 궤적으로 선택한 상태만 갱신</text><text x="320" y="452" font-size="19">모델 가중치 갱신이나 여러 상태 동시 수정이 아님</text></g></svg>