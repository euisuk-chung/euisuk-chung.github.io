<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">llmfit recommend 처리 흐름</title><desc id="desc">입력 확보, 모델별 분석, 실측 보정, 필터와 정렬, 출력 순서. 속도 보정은 score 재계산을 의미하지 않습니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="720" height="1100" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">llmfit: recommend의 입력부터 출력까지</text><rect x="32" y="80" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="118" font-size="25" font-weight="700" fill="#0f172a">01  CLI 입력 · main.rs</text><text x="54" y="156" font-size="23" fill="#334155">recommend 옵션 → run_recommend()</text><path d="M360 184 V204" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="212" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="250" font-size="25" font-weight="700" fill="#0f172a">02  분석 입력 확보</text><text x="54" y="288" font-size="23" fill="#334155">하드웨어·설정 / 모델 DB / 설치 모델 조회</text><path d="M360 316 V336" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="344" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="382" font-size="25" font-weight="700" fill="#0f172a">03  공통 분석 · analysis.rs</text><text x="54" y="420" font-size="23" fill="#334155">호환 후보 필터 → 모델별 fit.rs 계산</text><path d="M360 448 V468" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="476" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="514" font-size="25" font-weight="700" fill="#0f172a">04  ModelFit 생성 · fit.rs</text><text x="54" y="552" font-size="23" fill="#334155">양자화·실행 모드·메모리·속도·점수</text><path d="M360 580 V600" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="608" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="646" font-size="25" font-weight="700" fill="#0f172a">05  실측 연결과 추정 보정</text><text x="54" y="684" font-size="23" fill="#334155">설치 표시 → 실측 우선순위 → calibration</text><path d="M360 712 V732" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="740" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="778" font-size="25" font-weight="700" fill="#0f172a">06  최종 선택 · main.rs</text><text x="54" y="816" font-size="23" fill="#334155">조건 필터 → 점수 정렬 → 개수 제한</text><path d="M360 844 V864" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="872" width="656" height="104" rx="12" fill="white" stroke="#94a3b8"/><text x="54" y="910" font-size="25" font-weight="700" fill="#0f172a">07  결과 출력</text><text x="54" y="948" font-size="23" fill="#334155">JSON · CSV · 터미널 표 · llama.cpp 명령</text><text x="40" y="1035" font-size="22" fill="#92400e">주의: 속도 추정 보정 시 score는 재계산하지 않습니다.</text><text x="40" y="1070" font-size="19" fill="#475569">리뷰어 작성 · e5508a1 · CLI 추천 경로만 표시</text></g></svg>