<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc"><title id="title">구현과 재실행의 경계</title><desc id="desc">고정 커밋 641f2c6d23ce50da59f57e1bb36220cc98d38146의 코드에서 리뷰어가 작성한 흐름도입니다.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#446780"/></marker></defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#173147}.title{font-size:28px;font-weight:700}.main{font-size:26px;font-weight:700}.sub{font-size:22px}.note{font-size:21px}</style><rect width="600" height="430" fill="#fff"/><text x="300" y="37" text-anchor="middle" class="title">구현과 재실행의 경계</text><rect x="24" y="60" width="552" height="64" rx="12" fill="#eef5fb" stroke="#729ab7" stroke-width="2"/><text x="300.0" y="89" text-anchor="middle" class="main">고정 등록안 → 구현자</text><text x="300.0" y="117" text-anchor="middle" class="sub">단일 등록안 + 논문·코드</text><path d="M300,124 L300,136" fill="none" stroke="#446780" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="138" width="552" height="64" rx="12" fill="#eef5fb" stroke="#729ab7" stroke-width="2"/><text x="300.0" y="167" text-anchor="middle" class="main">구현·시험 → submit</text><text x="300.0" y="195" text-anchor="middle" class="sub">submission.tar.gz + 평가 명령</text><path d="M300,202 L300,214" fill="none" stroke="#446780" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="216" width="552" height="64" rx="12" fill="#eef5fb" stroke="#729ab7" stroke-width="2"/><text x="300.0" y="245" text-anchor="middle" class="main">새 머신에서 평가 명령 실행</text><text x="300.0" y="273" text-anchor="middle" class="sub">기존 result·등록 원시 출력 삭제</text><path d="M300,280 L300,292" fill="none" stroke="#446780" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="294" width="552" height="64" rx="12" fill="#eef5fb" stroke="#729ab7" stroke-width="2"/><text x="300.0" y="323" text-anchor="middle" class="main">delivered / no delivery</text><text x="300.0" y="351" text-anchor="middle" class="sub">유한한 value·정상 종료 / 실패</text><text x="300" y="412" text-anchor="middle" class="note">미전달 → 다른 실행자 1회 / 머신 장애 → 재개</text></svg>
