<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="title desc">
  <title id="title">LLM Council의 세 단계와 순위의 사용처</title>
  <desc id="desc">네 위원의 병렬 답변을 A부터 순서대로 붙여 자기 답변을 포함해 평가합니다. 평균 순위는 UI용이며 의장은 질문, 실제 모델명이 있는 원 답변과 평가 원문으로 종합합니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52677c"/></marker></defs>
  <rect width="360" height="470" rx="12" fill="#f5f8fc"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#172e43">
    <text x="180" y="29" font-size="18" font-weight="700">수집 → 평가 → 종합</text>
    <rect x="16" y="49" width="328" height="84" rx="10" fill="#e6f0ff" stroke="#98b4d8"/>
    <text x="180" y="76" font-size="18" font-weight="700">1. 위원들의 병렬 답변</text>
    <text x="180" y="105" font-size="16">같은 질문 / 성공 응답 수집</text>
    <path d="M180 140V169" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="177" width="328" height="113" rx="10" fill="#fff0de" stroke="#c39761"/>
    <text x="180" y="205" font-size="18" font-weight="700">2. 모든 답변을 병렬 평가</text>
    <text x="180" y="233" font-size="16">A/B 고정 순서 · 자기 답변 포함</text>
    <text x="180" y="267" font-size="16" font-weight="700">평균 순위 집계는 UI 표시용</text>
    <path d="M180 297V326" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="248" y="317" font-size="14">평가 원문</text>
    <rect x="16" y="334" width="328" height="84" rx="10" fill="#e8f4eb" stroke="#8ab198"/>
    <text x="180" y="361" font-size="18" font-weight="700">3. 의장의 새 답변 생성</text>
    <text x="180" y="390" font-size="16">질문 + 원 답변 + 평가 원문</text>
    <text x="180" y="451" font-size="15">집계 점수는 의장 입력에 없습니다.</text>
  </g>
</svg>
