<svg xmlns="http://www.w3.org/2000/svg" width="360" height="418" viewBox="0 0 360 418" role="img" aria-labelledby="title desc">
  <title id="title">LLM Council의 로컬 앱과 원격 API 경계</title>
  <desc id="desc">브라우저의 React 화면은 FastAPI에 질문을 보내고 단계별 이벤트를 받습니다. 서버는 원격 OpenRouter로 모델 요청을 보내고 완성된 결과를 로컬 JSON에 저장합니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#52677c"/></marker></defs>
  <rect width="360" height="418" rx="12" fill="#f5f8fc"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#172e43">
    <text x="180" y="28" font-size="18" font-weight="700">화면 · 서버 · 추론의 경계</text>
    <rect x="16" y="48" width="328" height="74" rx="10" fill="#e6f0ff" stroke="#98b4d8"/>
    <text x="180" y="76" font-size="18" font-weight="700">React 브라우저</text>
    <text x="180" y="103" font-size="16">질문 입력 / 단계별 탭 표시</text>
    <path d="M180 129V170" fill="none" stroke="#52677c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="205" y="132" width="117" height="31" rx="5" fill="#f5f8fc"/>
    <text x="263" y="153" font-size="14">HTTP / SSE</text>
    <rect x="16" y="178" width="328" height="86" rx="10" fill="#e6f0ff" stroke="#98b4d8"/>
    <text x="180" y="207" font-size="18" font-weight="700">FastAPI 서버</text>
    <text x="180" y="236" font-size="16">세 단계 진행 / 결과 저장</text>
    <path d="M94 271V317" fill="none" stroke="#52677c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M266 271V317" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="37" y="300" font-size="14">API</text>
    <text x="310" y="300" font-size="14">저장</text>
    <rect x="16" y="325" width="156" height="76" rx="10" fill="#fff0de" stroke="#c39761"/>
    <text x="94" y="352" font-size="17" font-weight="700">OpenRouter</text>
    <text x="94" y="379" font-size="15">원격 모델 추론</text>
    <rect x="188" y="325" width="156" height="76" rx="10" fill="#e8f4eb" stroke="#8ab198"/>
    <text x="266" y="352" font-size="17" font-weight="700">대화 JSON</text>
    <text x="266" y="379" font-size="15">로컬 파일 저장</text>
  </g>
</svg>
