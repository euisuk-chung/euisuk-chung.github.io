<svg xmlns="http://www.w3.org/2000/svg" width="600" height="465" viewBox="0 0 600 465" role="img" aria-labelledby="title desc"><title id="title">Pixelfx createAct의 시간 처리</title><desc id="desc">update는 흔들림 시간을 먼저 줄이고, 타격 정지 중에는 효과 시각과 시뮬레이션을 진행하지 않는다. 정지가 없을 때 효과·포즈·표적을 갱신한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="600" height="465" rx="16" fill="#f8fafc"/><text x="300" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172554" font-weight="700">타격 정지는 시계를 나눠 처리합니다</text><rect x="45" y="60" width="510" height="57" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="300" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554" font-weight="400">호출자가 update(dt) 전달</text><path d="M300 117 L300 143" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="45" y="146" width="510" height="56" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="300" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172554" font-weight="400">화면 흔들림의 남은 시간 감소</text><path d="M300 202 L300 229" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="45" y="232" width="510" height="56" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="300" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172554" font-weight="400">정지 중? 남은 정지만 줄이고 반환</text><path d="M300 288 L300 315" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="480" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569" font-weight="400">정지가 없을 때</text><rect x="45" y="318" width="510" height="58" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="300" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172554" font-weight="400">효과 시각·입자·포즈·표적 갱신</text><text x="300" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172554" font-weight="700">draw()는 현재 상태를 그립니다</text><text x="300" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#475569" font-weight="400">포즈는 12fps 단계, 위치 x/y는 연속 보간</text></svg>