<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc"><title id="title">Pixelfx 렌더링 경로</title><desc id="desc">효과 모듈을 createFx 또는 이를 감싸는 createAct로 재생하고, Painter가 두 버퍼를 채우면 composite가 RGBA를 만든다. 게임과 내보내기 도구가 같은 코어를 사용한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="600" height="460" rx="16" fill="#f8fafc"/><text x="300" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554" font-weight="700">효과 코드에서 화면·파일까지</text><rect x="38" y="58" width="524" height="62" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554" font-weight="400">효과 모듈: meta + draw / create</text><text x="300" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554" font-weight="400">필요할 때 act 데이터로 몸의 동작 추가</text><path d="M175 120 L175 150" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M425 120 L425 150" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="153" width="265" height="65" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="170" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554" font-weight="700">createFx</text><text x="170" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554" font-weight="400">효과 시각·위치·옵션</text><rect x="325" y="153" width="237" height="65" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="443" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554" font-weight="700">createAct</text><text x="443" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172554" font-weight="400">포즈·타격·표적</text><path d="M170 218 L170 245" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M443 218 L443 245" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="248" width="524" height="58" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="300" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554" font-weight="700">Painter → color + light 버퍼</text><path d="M300 306 L300 330" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="333" width="524" height="45" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="300" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172554" font-weight="400">composite → RGBA 픽셀</text><path d="M160 378 L160 401" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M440 378 L440 401" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="160" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172554" font-weight="400">게임의 Canvas / Texture</text><text x="440" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#172554" font-weight="400">도구의 PNG·JSON·영상</text></svg>