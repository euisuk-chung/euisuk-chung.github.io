<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" width="560" height="385" role="img" aria-labelledby="title desc">
  <title id="title">하네스에서 결정 모델의 선택을 채택하는 조건</title>
  <desc id="desc">도구와 인수를 열거해 결정 모델에 묻고 결정 지점별 임계값을 적용합니다. 임계값을 통과한 선택은 하네스가 사용하고, 확신도가 낮으면 LLM이 결정합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse">
      <path fill="#586579" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect width="560" height="385" rx="22" fill="#f5f7fa"/>
  <g fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M280 84v25"/>
    <path d="M280 171v23"/>
    <path d="M218 252v20h-84v23"/>
    <path d="M342 252v20h84v23"/>
  </g>
  <g stroke-width="1.5">
    <rect x="68" y="18" width="424" height="66" rx="11" fill="#fff" stroke="#a6b3c4"/>
    <rect x="68" y="109" width="424" height="62" rx="11" fill="#fff" stroke="#a6b3c4"/>
    <rect x="106" y="194" width="348" height="58" rx="11" fill="#eaf0ff" stroke="#8da5d4"/>
    <rect x="22" y="295" width="224" height="70" rx="11" fill="#e7f5ee" stroke="#7ab399"/>
    <rect x="314" y="295" width="224" height="70" rx="11" fill="#fff0dd" stroke="#d5a669"/>
  </g>
  <g text-anchor="middle" fill="#1a2638" font-family="system-ui, -apple-system, sans-serif">
    <g font-size="23" font-weight="700">
      <text x="280" y="46">하네스가 후보를 열거</text>
      <text x="280" y="137">결정 모델이 후보별 점수 계산</text>
      <text x="280" y="230">이 결정 지점의 임계값을 통과?</text>
      <text x="134" y="325">결정 모델 선택 채택</text>
      <text x="426" y="325">LLM이 결정</text>
    </g>
    <g font-size="18">
      <text x="280" y="70">도구 · 열거형 인수 · 복사할 값</text>
      <text x="280" y="159">가장 높은 점수의 후보와 확신도 반환</text>
      <text x="134" y="349">도구 실행에 사용</text>
      <text x="426" y="349">확신도가 낮은 선택</text>
    </g>
    <g font-size="19" font-weight="700">
      <text x="182" y="287">통과</text>
      <text x="378" y="287">미달</text>
    </g>
  </g>
</svg>
