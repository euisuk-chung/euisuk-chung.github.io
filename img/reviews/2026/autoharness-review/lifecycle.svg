<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img"><style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#17324d} .h{font-size:21px;font-weight:700}.t{font-size:18px}.s{font-size:16px}.b{fill:#edf5fb;stroke:#447da0;stroke-width:1.5}.a{fill:none;stroke:#526d82;stroke-width:2;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526d82"/></marker></defs><rect width="480" height="460" rx="12" fill="#fff"/><text x="240" y="32" text-anchor="middle" class="h">생명주기: 기본 졸업 심사 사용</text><rect x="30" y="57" width="420" height="60" rx="10" class="b"/><text x="240" y="83" text-anchor="middle" class="t">생성 후 계층 요청 수 &lt; maturity</text><text x="240" y="106" text-anchor="middle" class="s">미성숙: 보존 · 용량 계산에서 제외</text><path d="M240 117 V143" class="a"/><text x="366" y="139" text-anchor="middle" class="s">성숙하면</text><rect x="30" y="153" width="420" height="76" rx="10" class="b"/><text x="240" y="181" text-anchor="middle" class="t">성숙 스킬의 use · view 확인</text><text x="240" y="207" text-anchor="middle" class="s">둘 다 0이면 .archive로 이동</text><path d="M134 229 V265" class="a"/><path d="M346 229 V265" class="a"/><text x="125" y="253" text-anchor="middle" class="s">use = 0, view &gt; 0</text><text x="351" y="253" text-anchor="middle" class="s">use &gt; 0</text><rect x="20" y="275" width="204" height="84" rx="10" class="b"/><text x="122" y="306" text-anchor="middle" class="t">보존</text><text x="122" y="335" text-anchor="middle" class="s">용량 경쟁에서 제외</text><rect x="256" y="275" width="204" height="84" rx="10" class="b"/><text x="358" y="306" text-anchor="middle" class="t">용량 경쟁 집합</text><text x="358" y="335" text-anchor="middle" class="s">넘치면 낮은 rate부터 보관</text><text x="240" y="392" text-anchor="middle" class="t">rate = use / 생성 후 계층 요청 수</text><text x="240" y="419" text-anchor="middle" class="s">호출 전 이벤트 관측 ≠ 과제 성공 측정</text><text x="240" y="443" text-anchor="middle" class="s">리뷰어 작성 | 7f725a9 커밋 정적 분석</text></svg>