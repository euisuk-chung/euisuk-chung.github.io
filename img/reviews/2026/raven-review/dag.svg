<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img"><style>text{font-family:Arial,"Apple SD Gothic Neo",sans-serif;fill:#183247}.label{font-size:20px;font-weight:700}.sub{font-size:16px}.box{fill:#edf4fa;stroke:#7995b0;stroke-width:1.5}.arr{fill:none;stroke:#58758e;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#58758e"/></marker></defs><rect width="440" height="460" fill="#fff"/><title>Raven DAG 실행과 결과 확정</title><rect class="box" x="24" y="16" width="392" height="66" rx="12"/><text class="label" x="220" y="43" text-anchor="middle">제출된 노드와 의존성</text><text class="sub" x="220" y="66" text-anchor="middle">중복 · 참조 · 순환 · 등록 여부 검사</text><path class="arr" d="M220 82 V104"/><rect class="box" x="24" y="106" width="392" height="66" rx="12"/><text class="label" x="220" y="133" text-anchor="middle">실행할 수 있는 노드 선택</text><text class="sub" x="220" y="156" text-anchor="middle">상위 작업 완료 + 판정 확정</text><path class="arr" d="M220 172 V194"/><rect class="box" x="24" y="196" width="392" height="66" rx="12"/><text class="label" x="220" y="223" text-anchor="middle">동시성 제한 안에서 실행</text><text class="sub" x="220" y="246" text-anchor="middle">프롬프트 저장 → backend.run</text><path class="arr" d="M220 262 V284"/><rect class="box" x="24" y="286" width="392" height="66" rx="12"/><text class="label" x="220" y="313" text-anchor="middle">출력 기록 · 선택적 판정</text><text class="sub" x="220" y="336" text-anchor="middle">실패 / 예외 / 완료 상태 구분</text><path class="arr" d="M220 352 V374"/><rect class="box" x="24" y="376" width="392" height="66" rx="12"/><text class="label" x="220" y="403" text-anchor="middle">후속 작업 또는 실행 종료</text><text class="sub" x="220" y="426" text-anchor="middle">노드 기록과 manifest 유지</text></svg>