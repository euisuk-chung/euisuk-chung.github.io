<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460" role="img"><style>text{font-family:Arial,"Apple SD Gothic Neo",sans-serif;fill:#183247}.label{font-size:20px;font-weight:700}.sub{font-size:16px}.box{fill:#edf4fa;stroke:#7995b0;stroke-width:1.5}.arr{fill:none;stroke:#58758e;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#58758e"/></marker></defs><rect width="440" height="460" fill="#fff"/><title>Raven 런타임의 핵심 경로</title><rect class="box" x="24" y="16" width="392" height="66" rx="12"/><text class="label" x="220" y="43" text-anchor="middle">사용자 요청 · turn.send</text><text class="sub" x="220" y="66" text-anchor="middle">입력 검증 → 실행 레인 제출</text><path class="arr" d="M220 82 V104"/><rect class="box" x="24" y="106" width="392" height="66" rx="12"/><text class="label" x="220" y="133" text-anchor="middle">호스트 에이전트 루프</text><text class="sub" x="220" y="156" text-anchor="middle">문맥 · 도구 선택 · 모델 행동</text><path class="arr" d="M220 172 V194"/><rect class="box" x="24" y="196" width="392" height="66" rx="12"/><text class="label" x="220" y="223" text-anchor="middle">위임을 선택한 경우: DAG</text><text class="sub" x="220" y="246" text-anchor="middle">구조 검사 · 의존성 · 결과 판정</text><path class="arr" d="M220 262 V284"/><rect class="box" x="24" y="286" width="392" height="66" rx="12"/><text class="label" x="220" y="313" text-anchor="middle">등록된 전문 에이전트</text><text class="sub" x="220" y="336" text-anchor="middle">내부 루프 / ACP / CLI / HTTP</text><path class="arr" d="M220 352 V374"/><rect class="box" x="24" y="376" width="392" height="66" rx="12"/><text class="label" x="220" y="403" text-anchor="middle">결과 파일과 manifest</text><text class="sub" x="220" y="426" text-anchor="middle">프롬프트 · 출력 · 상태 · 오류</text></svg>