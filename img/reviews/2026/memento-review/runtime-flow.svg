<svg xmlns="http://www.w3.org/2000/svg" width="460" height="490" viewBox="0 0 460 490" role="img" aria-labelledby="t d"><title id="t">Memento 실행 구조</title><desc id="d">질문과 사례를 받은 Planner가 Executor의 도구 실행 결과로 재계획하고 최종 답변을 반환합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#53647d" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#17243b} .box{fill:#f1f5fc;stroke:#a9b9d1;stroke-width:1.5} .line{fill:none;stroke:#53647d;stroke-width:1.5;marker-end:url(#arrow)} .small{font-size:16px}.label{font-size:18px;font-weight:600}.sub{font-size:16px}</style><rect width="460" height="490" fill="#fff"/><rect class="box" x="50" y="12" width="360" height="48" rx="9"/><text class="label" x="230" y="42" text-anchor="middle">질문 · 선택적 파일 경로</text><path class="line" d="M230 62 V93"/><rect class="box" x="50" y="100" width="360" height="65" rx="9"/><text class="label" x="230" y="127" text-anchor="middle">Planner → JSON 계획</text><text class="sub" x="230" y="151" text-anchor="middle">CBR 경로: 검색 사례도 입력</text><path class="line" d="M195 169 V207"/><path class="line" d="M265 210 V172"/><text class="small" x="291" y="194">과제 / 결과</text><rect class="box" x="50" y="216" width="360" height="55" rx="9"/><text class="label" x="230" y="250" text-anchor="middle">Executor · 하위 과제 처리</text><path class="line" d="M195 275 V314"/><path class="line" d="M265 316 V278"/><text class="small" x="290" y="302">MCP 왕복</text><rect class="box" x="50" y="322" width="360" height="65" rx="9"/><text class="label" x="230" y="349" text-anchor="middle">stdio 도구 서버 프로세스</text><text class="sub" x="230" y="373" text-anchor="middle">검색 · 문서 · 코드 · 외부 API</text><path class="line" stroke-dasharray="5 4" d="M50 133 H22 V455 H43"/><text class="small" x="230" y="414" text-anchor="middle">계획 반복 후 Planner가 답변 반환</text><rect class="box" x="50" y="432" width="360" height="44" rx="9"/><text class="label" x="230" y="461" text-anchor="middle">최종 답변 → 터미널 / 결과 로그</text></svg>
