<svg xmlns="http://www.w3.org/2000/svg" width="460" height="466" viewBox="0 0 460 466" role="img" aria-labelledby="t d"><title id="t">Memento 메모리 축적과 별도 검색기 학습</title><desc id="d">검색 사례로 과제를 실행하고 정답 판정을 얻어 사례 메모리와 학습 쌍을 저장합니다. 검색기 학습과 체크포인트 생성은 별도 스크립트입니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#53647d" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#17243b} .box{fill:#f1f5fc;stroke:#a9b9d1;stroke-width:1.5} .line{fill:none;stroke:#53647d;stroke-width:1.5;marker-end:url(#arrow)} .small{font-size:16px}.label{font-size:18px;font-weight:600}.sub{font-size:16px}</style><rect width="460" height="466" fill="#fff"/><rect class="box" x="36" y="12" width="388" height="44" rx="9"/><text class="label" x="230" y="40" text-anchor="middle">현재 질문</text><path class="line" d="M230 58 V82"/><rect class="box" x="36" y="90" width="388" height="62" rx="9"/><text class="label" x="230" y="116" text-anchor="middle">사례 점수 계산 → 상위 K개</text><text class="sub" x="230" y="140" text-anchor="middle">성공 / 실패 예시로 Planner 입력</text><path class="line" d="M230 155 V177"/><rect class="box" x="36" y="184" width="388" height="62" rx="9"/><text class="label" x="230" y="211" text-anchor="middle">계획 · 도구 실행 → 최종 답변</text><text class="sub" x="230" y="235" text-anchor="middle">정답 목록 + 판정기 → 성공 여부</text><path class="line" d="M160 250 L120 277"/><path class="line" d="M300 250 L340 277"/><rect class="box" x="12" y="284" width="212" height="63" rx="9"/><text class="label" x="118" y="310" text-anchor="middle">사례 메모리 추가</text><text class="sub" x="118" y="334" text-anchor="middle">질문 · 계획 · 라벨</text><rect class="box" x="236" y="284" width="212" height="63" rx="9"/><text class="label" x="342" y="310" text-anchor="middle">학습 쌍 추가</text><text class="sub" x="342" y="334" text-anchor="middle">query / case / 결과</text><path class="line" stroke-dasharray="5 4" d="M342 351 V370 H230 V383"/><rect class="box" x="45" y="390" width="370" height="47" rx="9"/><text class="label" x="230" y="420" text-anchor="middle">별도 학습 → 검색기 체크포인트</text><text class="small" x="230" y="458" text-anchor="middle">LLM 가중치와 검색기 가중치는 구분</text></svg>
