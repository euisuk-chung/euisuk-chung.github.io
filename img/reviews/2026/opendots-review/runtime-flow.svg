<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 440 480" role="img" aria-labelledby="title"><title id="title">텍스트 대화의 실행 경로</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536581"/></marker></defs><rect width="440" height="480" rx="16" fill="#f5f8fc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#142b45"><text x="220" y="30" font-size="19" font-weight="700">텍스트 대화의 실행 경로</text><rect x="20" y="48" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="71" font-size="17" font-weight="700">Chat · 사용자 메시지</text><text x="220" y="94" font-size="15">CopilotKit SDK에 대화 턴 요청</text><path d="M220,108 L220,122" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="125" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="148" font-size="17" font-weight="700">Hono → Platform → Runtime</text><text x="220" y="171" font-size="15">인증 · 경로 · Dot / Thread 범위 검사</text><path d="M220,185 L220,199" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="225" font-size="17" font-weight="700">DotAgent → TanStack AI</text><text x="220" y="248" font-size="15">모델 응답 · 허용 도구 · 중단 검사</text><path d="M220,262 L220,276" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="279" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="302" font-size="17" font-weight="700">도구 실행과 이벤트 반환</text><text x="220" y="325" font-size="15">페이지 / 검색 MCP / 외부 컴퓨터</text><path d="M220,339 L220,353" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="356" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="379" font-size="17" font-weight="700">저장 책임의 분리</text><text x="220" y="402" font-size="15">SQLite: 문서·설정 / Intelligence: 대화</text><text x="220" y="455" font-size="14">개요 · 실제 외부 호출은 선택한 도구에 따라 달라짐</text></g></svg>