<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 440 480" role="img" aria-labelledby="title"><title id="title">검토 카드에서 페이지 저장까지</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536581"/></marker></defs><rect width="440" height="480" rx="16" fill="#f5f8fc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#142b45"><text x="220" y="30" font-size="19" font-weight="700">검토 카드에서 페이지 저장까지</text><rect x="20" y="48" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="71" font-size="17" font-weight="700">review_space_page 호출</text><text x="220" y="94" font-size="15">초안 표시 → 사용자의 결정</text><path d="M220,108 L220,122" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="125" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="148" font-size="17" font-weight="700">기존 영수증 조회</text><text x="220" y="171" font-size="15">있음: 저장 페이지 복구 / 없음: 결정 처리</text><path d="M220,185 L220,199" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="225" font-size="17" font-weight="700">새 저장은 승인한 경우에만</text><text x="220" y="248" font-size="15">거절: 새 페이지를 만들지 않음</text><path d="M220,262 L220,276" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="279" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="302" font-size="17" font-weight="700">서버: Thread · Space 권한 확인</text><text x="220" y="325" font-size="15">BEGIN IMMEDIATE → 영수증 재확인</text><path d="M220,339 L220,353" stroke="#536581" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="356" width="400" height="59" rx="10" fill="white" stroke="#91abc5"/><text x="220" y="379" font-size="17" font-weight="700">페이지 + 영수증을 함께 commit</text><text x="220" y="402" font-size="15">중복이면 기존 페이지 반환 → 대화 재개</text><text x="220" y="455" font-size="14">영수증 키: threadId + toolCallId</text></g></svg>