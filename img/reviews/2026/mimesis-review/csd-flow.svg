<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" role="img" aria-labelledby="title desc">
<title id="title">CSD 기본 경로의 공개 문맥과 교사 문맥</title><desc id="desc">에이전트가 공개 대화로 응답을 생성합니다. 사용자 shim이 공개 다음 발화와 비공개 추론을 분리합니다. rollout 뒤 코칭을 만들고 현재 actor가 원 응답 토큰을 코칭 문맥에서 재평가합니다. gradient를 고정한 교사와 student의 차이로 gate를 만들어 GRPO 손실에 더합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526274"/></marker></defs>
<rect width="520" height="500" rx="14" fill="#f7f9fc"/>
<g font-family="Arial, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#142c43">
<text x="260" y="30" font-size="22" font-weight="700">CSD · 생성한 토큰을 다시 평가</text>
<rect x="25" y="48" width="470" height="57" rx="9" fill="#e4f2f2" stroke="#9dbec3"/>
<text x="260" y="73" font-size="19" font-weight="700">공개 history → agent 응답 토큰 y</text>
<text x="260" y="95" font-size="17">gym 실행 → 사용자 응답 · 과제 보상</text>
<path d="M260 106 V122" stroke="#526274" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="126" width="470" height="64" rx="9" fill="#fff0d7" stroke="#c5a56d"/>
<text x="260" y="151" font-size="19" font-weight="700">사용자 shim · episode별 분리</text>
<text x="260" y="176" font-size="18">공개 발화 → gym / 추론 → private buffer</text>
<path d="M260 191 V208" stroke="#526274" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="212" width="470" height="65" rx="9" fill="#eee8fa" stroke="#b5a0d1"/>
<text x="260" y="237" font-size="19" font-weight="700">rollout 뒤 post-pass → coach API → hint</text>
<text x="260" y="262" font-size="17">기본 prospective: history · 직전 추론 · 다음 발화</text>
<path d="M260 278 V297" stroke="#526274" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M260 297 H140 V310 M260 297 H380 V310" fill="none" stroke="#526274" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="315" width="230" height="82" rx="9" fill="#e4f2f2" stroke="#9dbec3"/>
<text x="140" y="340" font-size="19" font-weight="700">Student · 현재 actor</text>
<text x="140" y="365" font-size="18">공개 history + 원 토큰 y</text>
<text x="140" y="388" font-size="17">gradient 계산</text>
<rect x="265" y="315" width="230" height="82" rx="9" fill="#eee8fa" stroke="#b5a0d1"/>
<text x="380" y="340" font-size="19" font-weight="700">Teacher · 같은 actor</text>
<text x="380" y="365" font-size="18">history + hint + 같은 y</text>
<text x="380" y="388" font-size="17">no_grad · 위치 매핑</text>
<path d="M140 398 V415 H260 M380 398 V415 H260 V432" fill="none" stroke="#526274" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="437" width="470" height="45" rx="9" fill="#142c43"/>
<text x="260" y="465" fill="#fff" font-size="19" font-weight="700">토큰별 차이 → gate → GRPO + 0.01 × CSD</text>
</g></svg>
