<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Go 전용 sandbox의 입출력</title><desc id="desc">매 호출마다 별도 Python 프로세스를 실행하고 작업 폴더에 가중치를 저장합니다. 코드를 실행한 출력을 모델에게 돌려주고 일부를 로그에 남깁니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs><rect width="720" height="420" rx="18" fill="#f6f8fc"/><g font-family="sans-serif" fill="#172b45"><text x="30" y="42" font-size="30" font-weight="700">Go 전용 sandbox의 입출력</text><rect x="25" y="80" width="300" height="100" rx="13" fill="#e5efff" stroke="#8aa4c5" stroke-width="2"/><text x="175.0" y="119" text-anchor="middle" font-size="28" font-weight="700">코드 문자열</text><text x="175.0" y="153" text-anchor="middle" font-size="25">code + PRELUDE</text><rect x="395" y="80" width="300" height="100" rx="13" fill="#fff0d9" stroke="#8aa4c5" stroke-width="2"/><text x="545.0" y="119" text-anchor="middle" font-size="28" font-weight="700">bwrap → Python</text><text x="545.0" y="153" text-anchor="middle" font-size="25">격리·CPU·900초</text><rect x="395" y="270" width="300" height="100" rx="13" fill="#e3f2e9" stroke="#8aa4c5" stroke-width="2"/><text x="545.0" y="309" text-anchor="middle" font-size="28" font-weight="700">반환 출력·로그</text><text x="545.0" y="343" text-anchor="middle" font-size="25">stdout + stderr</text><rect x="25" y="270" width="300" height="100" rx="13" fill="#e5efff" stroke="#8aa4c5" stroke-width="2"/><text x="175.0" y="309" text-anchor="middle" font-size="28" font-weight="700">/work 파일 유지</text><text x="175.0" y="343" text-anchor="middle" font-size="25">arch.json · net/*.npy</text><path d="M 325 130 L 385 130" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 545 180 L 545 260" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 395 160 L 355 160 L 355 320 L 335 320" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="215" font-size="25">load / save</text><text x="30" y="247" font-size="23">이름·shape·유한값 검사</text><text x="30" y="405" font-size="23">변수는 유지하지 않음 · Qwen kernel 구현은 미포함</text></g></svg>