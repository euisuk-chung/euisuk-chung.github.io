<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">실험 기록을 읽는 네 단계</title><desc id="desc">프롬프트와 가중치를 Astra에게 주고 응답을 받습니다. 실험에 따라 외부 실행이 피드백을 제공하며 최종 가중치와 평가를 기록합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs><rect width="720" height="390" rx="18" fill="#f6f8fc"/><g font-family="sans-serif" fill="#172b45"><text x="30" y="42" font-size="30" font-weight="700">실험 기록을 읽는 네 단계</text><rect x="25" y="78" width="300" height="100" rx="13" fill="#e5efff" stroke="#8aa4c5" stroke-width="2"/><text x="175.0" y="117" text-anchor="middle" font-size="28" font-weight="700">1  입력</text><text x="175.0" y="151" text-anchor="middle" font-size="25">구조·가중치·문제</text><rect x="395" y="78" width="300" height="100" rx="13" fill="#e5efff" stroke="#8aa4c5" stroke-width="2"/><text x="545.0" y="117" text-anchor="middle" font-size="28" font-weight="700">2  Astra 응답</text><text x="545.0" y="151" text-anchor="middle" font-size="25">해석·edits·코드</text><rect x="395" y="248" width="300" height="100" rx="13" fill="#fff0d9" stroke="#8aa4c5" stroke-width="2"/><text x="545.0" y="287" text-anchor="middle" font-size="28" font-weight="700">3  별도 실행</text><text x="545.0" y="321" text-anchor="middle" font-size="25">허용된 실험만</text><rect x="25" y="248" width="300" height="100" rx="13" fill="#e3f2e9" stroke="#8aa4c5" stroke-width="2"/><text x="175.0" y="287" text-anchor="middle" font-size="28" font-weight="700">4  기록·산출물</text><text x="175.0" y="321" text-anchor="middle" font-size="25">답·가중치·평가</text><path d="M 325 128 L 385 128" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 545 178 L 545 238" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 395 298 L 335 298" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><text x="25" y="218" font-size="24">실험 3·6·7·8: 실행 결과를 다음 턴에 전달</text><text x="25" y="378" font-size="22">실험 1·2·4·5는 외부 실행 피드백 없이 한 번 응답</text></g></svg>