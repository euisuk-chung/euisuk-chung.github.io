<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc">
<title id="title">질문별 입력과 선택지 점수화</title>
<desc id="desc">공유 상태는 한 번 토큰화하고 질문마다 입력 행을 만듭니다. 배치 인코더와 typed head가 마커 벡터를 점수화하고 온도 보정 후 타입별 응답을 반환합니다.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#536478"/></marker></defs>
<rect width="480" height="500" fill="#f7f9fc"/>
<text x="24" y="35" font-family="sans-serif" font-size="23" font-weight="bold" fill="#162c46">질문별 입력과 선택지 점수화</text>
<rect x="18" y="60" width="444" height="100" rx="12" fill="#ffffff" stroke="#99abc0" stroke-width="2"/>
<text x="240" y="90" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">질문 A + 선택지 + 상태</text>
<text x="240" y="117" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">질문 B + 선택지 + 상태</text>
<text x="240" y="144" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">상태 토큰 재사용 · 질문별 행 구성</text>
<rect x="18" y="185" width="444" height="80" rx="12" fill="#ffffff" stroke="#99abc0" stroke-width="2"/>
<text x="240" y="218.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">배치 인코더 + type embedding</text>
<text x="240" y="245.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">추가 Transformer head</text>
<rect x="18" y="290" width="444" height="80" rx="12" fill="#ffffff" stroke="#99abc0" stroke-width="2"/>
<text x="240" y="323.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">선택지 [MASK] 위치의 벡터 수집</text>
<text x="240" y="350.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">공통 scorer → 선택지별 logits</text>
<rect x="18" y="395" width="444" height="80" rx="12" fill="#ffffff" stroke="#99abc0" stroke-width="2"/>
<text x="240" y="428.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">온도 softmax → 선택지 확률</text>
<text x="240" y="455.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#162c46">choice · score · noul</text>
<path d="M240 162 L240 180" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M240 267 L240 285" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M240 372 L240 390" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
