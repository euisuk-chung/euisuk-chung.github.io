<svg xmlns="http://www.w3.org/2000/svg" width="540" height="486" viewBox="0 0 540 486" role="img" aria-label="문서에서 그래프 재료로"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="540" height="486" rx="18" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" text-anchor="middle"><text x="270" y="39" font-size="25" font-weight="700" fill="#0f172a">문서에서 그래프 재료로</text><rect x="25" y="66" width="490" height="65" rx="12" fill="#e0f2fe" stroke="#cbd5e1"/><text x="270" y="93" font-size="22" font-weight="700" fill="#0f172a">문서 조각 + 온톨로지</text><text x="270" y="117" font-size="19" fill="#334155">세그먼트마다 관련 정의 선택</text><path d="M270,133 L270,148" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="152" width="490" height="65" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/><text x="270" y="179" font-size="22" font-weight="700" fill="#0f172a">LLM 추출 → JSONL 파싱</text><text x="270" y="203" font-size="19" fill="#334155">개체 · 관계 · 속성으로 구조화</text><path d="M270,219 L270,234" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="238" width="490" height="65" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="270" y="265" font-size="22" font-weight="700" fill="#0f172a">RDF 변환 + 출처 연결</text><text x="270" y="289" font-size="19" fill="#334155">알려진 타입과 domain / range 검사</text><path d="M270,305 L270,320" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="324" width="490" height="65" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="270" y="351" font-size="22" font-weight="700" fill="#0f172a">메시지 발행</text><text x="270" y="375" font-size="19" fill="#334155">Triples + EntityContexts</text><text x="270" y="470" font-size="18" fill="#475569">이후 저장 경로는 flow 구성에 따릅니다</text></g></svg>