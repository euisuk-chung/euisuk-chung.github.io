<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">JevAct의 선택적 실행 전 검사</title><desc id="desc">정책을 오프라인에서 검사로 준비한 뒤, 에이전트의 쓰기 또는 업무 포기 제안만 검사합니다. 통과하면 실행하고 문제가 있으면 한정된 횟수만 수정하며, 예산 소진 뒤 다음 제안은 검사 없이 실행합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="640" height="480" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'Apple SD Gothic Neo', sans-serif" text-anchor="middle" fill="#172554">
<text x="320" y="32" font-size="24" font-weight="700">제안과 실행 사이에 검사를 둡니다</text>
<rect x="32" y="50" width="576" height="72" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
<text x="320" y="79" font-size="22" font-weight="700">사전 준비: 정책 → 질문·규칙·코드·체크리스트</text>
<text x="320" y="105" font-size="19">컴파일러 LLM이 도메인별로 준비합니다</text>
<rect x="152" y="151" width="336" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
<text x="320" y="182" font-size="23" font-weight="700">에이전트 LLM이 행동을 제안</text>
<rect x="152" y="228" width="336" height="74" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
<text x="320" y="258" font-size="22" font-weight="700">쓰기 호출·업무 포기만 검사</text>
<text x="320" y="286" font-size="20">코드: 기록 계산 / Kev: 대화 판단</text>
<rect x="32" y="338" width="264" height="62" rx="10" fill="#dcfce7" stroke="#86efac"/>
<text x="164" y="365" font-size="23" font-weight="700">통과 → 실행·기록</text>
<text x="164" y="389" font-size="18">검사 대상이 아니어도 실행</text>
<rect x="344" y="338" width="264" height="62" rx="10" fill="#ffedd5" stroke="#fdba74"/>
<text x="476" y="365" font-size="23" font-weight="700">문제 → 버리고 재제안</text>
<text x="476" y="389" font-size="18">피드백은 다음 호출에만 전달</text>
<text x="320" y="437" font-size="21" font-weight="700">쓰기 수정 2회 / 업무 포기 수정 1회</text>
<text x="320" y="465" font-size="20">예산 소진 뒤 다음 제안은 검사 없이 실행됩니다</text>
</g>
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
<path d="M320 199V227"/><path d="M250 302V320H164V337"/><path d="M390 302V320H476V337"/><path d="M608 370H625V175H489"/>
</g>
</svg>
