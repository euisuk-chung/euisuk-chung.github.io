<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc"><title id="title">공개 데이터 준비 흐름</title><desc id="desc">고정된 Hub revision과 subset ID를 기준으로 download가 raw를 만들고 prepare가 벤치마크별로 processed를 출력합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3777a7"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="680" height="420" rx="14" fill="#fff"/><text x="340" y="38" text-anchor="middle" font-size="30" fill="#16314b" font-weight="700">공개 데이터 준비 흐름</text><rect x="30" y="58" width="620" height="62" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="97" text-anchor="middle" font-size="27" fill="#16314b" font-weight="400">Hub revision + 표본 ID JSON</text><path d="M340 122 V140" stroke="#3777a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="145" width="620" height="62" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="184" text-anchor="middle" font-size="27" fill="#16314b" font-weight="400">download.py → raw 파일</text><path d="M340 209 V227" stroke="#3777a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="232" width="620" height="76" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="263" text-anchor="middle" font-size="27" fill="#16314b" font-weight="400">prepare.py → ID 선택</text><text x="340" y="294" text-anchor="middle" font-size="24" fill="#16314b" font-weight="400">MINT 대화만 block → turn 변환</text><path d="M340 310 V328" stroke="#3777a7" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="333" width="620" height="62" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="372" text-anchor="middle" font-size="26" fill="#16314b" font-weight="400">processed: JSON · CSV · Parquet</text></g></svg>
