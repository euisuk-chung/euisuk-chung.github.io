<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc"><title id="title">공개 구현과 미공개 연결</title><desc id="desc">파란 영역은 데이터 준비와 프롬프트·파서 구현, 점선 영역은 아직 공개되지 않은 harness·API·집계 연결입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3777a7"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="680" height="420" rx="14" fill="#fff"/><text x="340" y="40" text-anchor="middle" font-size="30" fill="#16314b" font-weight="700">공개 구현과 미공개 연결</text><text x="26" y="80" text-anchor="start" font-size="24" fill="#16314b" font-weight="700">공개된 코드</text><rect x="24" y="95" width="632" height="82" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="128" text-anchor="middle" font-size="26" fill="#16314b" font-weight="400">데이터 준비 · QA 메시지 · judge 파서</text><text x="340" y="159" text-anchor="middle" font-size="24" fill="#16314b" font-weight="400">파일·문자열을 변환하는 함수</text><text x="26" y="217" text-anchor="start" font-size="24" fill="#16314b" font-weight="700">문서에 설명된 연결</text><rect x="24" y="232" width="632" height="132" rx="12" fill="#fff7e8" stroke="#a76b18" stroke-width="2" stroke-dasharray="8 6"/><text x="340" y="266" text-anchor="middle" font-size="25" fill="#16314b" font-weight="400">baseline harness · 검색·기억 생성</text><text x="340" y="305" text-anchor="middle" font-size="25" fill="#16314b" font-weight="400">API 호출 · 토큰/호출 계측</text><text x="340" y="344" text-anchor="middle" font-size="25" fill="#16314b" font-weight="400">judge 실행 · 저장·최종 집계</text><text x="340" y="402" text-anchor="middle" font-size="23" fill="#80541a" font-weight="400">점선: 실행 코드 미공개</text></g></svg>
