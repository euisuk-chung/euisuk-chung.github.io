<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc"><title id="title">PersonaMem 평가의 호출자 경계</title><desc id="desc">공개된 parse_answer는 선택지 문자나 빈 문자열을 반환합니다. exact match와 judge 호출·집계는 미공개 실행기가 연결해야 하며, parse_verdict는 1·0·None을 반환합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3777a7"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="680" height="420" rx="14" fill="#fff"/><text x="340" y="38" text-anchor="middle" font-size="29" fill="#16314b" font-weight="700">PersonaMem 평가의 호출자 경계</text><rect x="24" y="59" width="632" height="72" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="89" text-anchor="middle" font-size="26" fill="#16314b" font-weight="400">parse_answer(raw, options)</text><text x="340" y="119" text-anchor="middle" font-size="24" fill="#16314b" font-weight="400">출력: A–D 또는 빈 문자열</text><rect x="24" y="151" width="632" height="84" rx="12" fill="#fff7e8" stroke="#a76b18" stroke-width="2" stroke-dasharray="8 6"/><text x="340" y="184" text-anchor="middle" font-size="26" fill="#16314b" font-weight="400">호출자: 문자면 정답과 비교</text><text x="340" y="218" text-anchor="middle" font-size="25" fill="#16314b" font-weight="400">빈 문자열이면 judge 호출 준비</text><rect x="24" y="255" width="632" height="65" rx="12" fill="#eaf3fc" stroke="#3777a7" stroke-width="2"/><text x="340" y="296" text-anchor="middle" font-size="26" fill="#16314b" font-weight="400">judge 메시지 생성 · 판정 파서</text><rect x="24" y="340" width="632" height="59" rx="12" fill="#fff7e8" stroke="#a76b18" stroke-width="2" stroke-dasharray="8 6"/><text x="340" y="378" text-anchor="middle" font-size="24" fill="#16314b" font-weight="400">judge API · 결과 저장·집계: 미공개</text></g></svg>
