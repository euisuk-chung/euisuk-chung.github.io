<svg xmlns="http://www.w3.org/2000/svg" width="460" height="490" viewBox="0 0 460 490" role="img" aria-labelledby="t"><title id="t">기본 GitHub 저장소의 문서 확보 순서</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#475569"/></marker></defs><rect width="460" height="490" rx="12" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#0f172a"><text x="230" y="29" text-anchor="middle" font-size="17" font-weight="700">문서 가져오기: 실패하면 다음 출처</text><rect x="24" y="47" width="412" height="56" rx="9" fill="#fef3c7" stroke="#94a3b8"/><text x="230.0" y="70.0" text-anchor="middle" font-size="14" font-weight="700">1. 문서 응답 캐시</text><text x="230.0" y="90.0" text-anchor="middle" font-size="14">owner/repo 단위 · TTL 30분</text><path d="M230 105V123" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="127" width="412" height="56" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700">2. GitHub 정적 경로 병렬 조회</text><text x="230.0" y="170.0" text-anchor="middle" font-size="14">docs/docs → root → docs 의 llms.txt</text><path d="M230 185V203" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="207" width="412" height="56" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="230.0" text-anchor="middle" font-size="14" font-weight="700">3. GitHub 파일 검색</text><text x="230.0" y="250.0" text-anchor="middle" font-size="14">llms.txt 검색 결과의 파일 읽기</text><path d="M230 265V283" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="287" width="412" height="56" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="230.0" y="310.0" text-anchor="middle" font-size="14" font-weight="700">4. R2에 준비된 생성 문서</text><text x="230.0" y="330.0" text-anchor="middle" font-size="14">owner/repo/llms.txt</text><path d="M230 345V363" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="367" width="412" height="56" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="390.0" text-anchor="middle" font-size="14" font-weight="700">5. 루트 README.* 검색</text><text x="230.0" y="410.0" text-anchor="middle" font-size="14">없으면 No documentation found.</text><text x="230" y="449" text-anchor="middle" font-size="13">확보하면 뒤의 출처 탐색을 생략합니다.</text><text x="230" y="470" text-anchor="middle" font-size="13">Pages URL은 별도의 웹 조회 경로를 사용합니다.</text></g></svg>