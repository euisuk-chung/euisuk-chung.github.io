<svg xmlns="http://www.w3.org/2000/svg" width="460" height="490" viewBox="0 0 460 490" role="img" aria-labelledby="t"><title id="t">GitMCP 요청 경계와 데이터 흐름</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#475569"/></marker></defs><rect width="460" height="490" rx="12" fill="#f8fafc"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#0f172a"><text x="230" y="29" text-anchor="middle" font-size="18" font-weight="700">GitMCP: 도구 응답의 경계</text><rect x="30" y="47" width="400" height="50" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="67.0" text-anchor="middle" font-size="14" font-weight="700">AI 클라이언트</text><text x="230.0" y="87.0" text-anchor="middle" font-size="14">질문에 필요한 MCP 도구 호출</text><path d="M230 99V119" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="123" width="400" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="139.0" text-anchor="middle" font-size="14" font-weight="700">Worker: HTTP 요청 분기</text><text x="230.0" y="159.0" text-anchor="middle" font-size="14">SSE 수락 헤더 → MyMCP</text><text x="230.0" y="179.0" text-anchor="middle" font-size="14">그 외 → 웹 안내 · 채팅 화면</text><path d="M230 187V207" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="211" width="400" height="54" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="233.0" text-anchor="middle" font-size="14" font-weight="700">RepoData → 핸들러 → 도구</text><text x="230.0" y="253.0" text-anchor="middle" font-size="14">저장소 고정 / 범용 인자 / 전용 핸들러</text><path d="M230 267V287" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="291" width="400" height="74" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="230.0" y="313.0" text-anchor="middle" font-size="14" font-weight="700">문서 확보 · 검색 · 코드 위치</text><text x="230.0" y="333.0" text-anchor="middle" font-size="14">GitHub / Pages / R2 문서</text><text x="230.0" y="353.0" text-anchor="middle" font-size="14">AutoRAG + KV · HTTP 캐시</text><path d="M230 367V387" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="391" width="400" height="50" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="230.0" y="411.0" text-anchor="middle" font-size="14" font-weight="700">텍스트 · 출처 · 상태를 반환</text><text x="230.0" y="431.0" text-anchor="middle" font-size="14">최종 답변은 클라이언트 모델이 작성</text><text x="230" y="466" text-anchor="middle" font-size="13">내장 채팅의 모델 요청은 별도 경로입니다.</text></g></svg>