name: Velog Sync

on:
  schedule:
    - cron: '0 9 1 * *'    # 매월 1일 18:00 KST
  workflow_dispatch:         # 수동 트리거 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - name: Install Python & deps
        run: |
          uv python install 3.11
          uv sync --frozen --project _scripts

      - name: Ensure Chrome
        run: google-chrome --version

      # continue-on-error 로 두어 부분 성공분은 커밋되게 하되,
      # 아래 "Report crawl failure" 에서 잡 자체는 빨간불로 만든다.
      - name: Crawl new Velog posts
        id: crawl
        run: uv run --project _scripts python _scripts/blog_crawler.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ processed_posts.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync Velog posts ($(date -u +'%Y-%m-%d'))"
            git push origin master
          fi

      - name: Upload error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs-${{ github.run_id }}
          path: error_log.txt
          if-no-files-found: ignore
          retention-days: 30

      # 크롤링이 실패하면 커밋/아티팩트 업로드까지 끝낸 뒤 잡을 실패 처리한다.
      # 이게 없으면 새 글이 하나도 안 들어와도 워크플로가 초록불이라
      # 동기화가 끊긴 걸 알아채지 못한다.
      - name: Report crawl failure
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "::error::Velog 크롤링 실패. 위 로그와 crawl-logs-${{ github.run_id }} 아티팩트를 확인하세요."
          exit 1
