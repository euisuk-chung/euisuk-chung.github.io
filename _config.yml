# Site settings
title: Euisuk's Dev Log
SEOTitle: Chung Euisuk | Data Scientist
header-img: img/home-bg.jpg
email: jasuchung@gmail.com
description: "Always be passionate🌱"
keyword: "Machine Learning, TimeSeries, Anomaly Detection, NLP, Vision, AI/ML, MLOps, AIOps"
url: "https://euisuk-chung.github.io"              # your host, for absolute URL
baseurl: ""  # for example, '/blog' if your blog hosted on 'host/blog'

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
instagram_username: chung_es
github_username:   euisuk-chung
youtube_username:  loading_700
linkedin_username:  euisuk-chung

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
    "_scripts",
    "processed_posts.csv",
    "AGENTS.md",
  ]

anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# 기본 레이아웃
# velog 동기화 포스트에는 front-matter에 layout이 없다.
# GitHub Pages 레거시 빌드는 알아서 post 레이아웃을 씌워주지만,
# 로컬 Jekyll 4나 Actions 기반 빌드는 그렇지 않아 본문만 렌더된다.
# 빌드 환경에 관계없이 동일하게 나오도록 여기서 명시한다.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "concepts"
    values:
      layout: "tag"

# 태그 사전(concept) 컬렉션. 파일 하나가 태그 하나를 정의하고 /tags/<slug>/ 페이지가 된다.
# 컬렉션 이름을 `tags`로 두면 Jekyll 내장 site.tags(포스트 태그 집계)에 가려져 템플릿에서 읽을 수 없다.
collections:
  concepts:
    output: true
    permalink: /tags/:slug/

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
# disqus_username: your_disqus_shortname

# Netease settings
